<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Word Cube - Wordle Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            font-family: system-ui, -apple-system, sans-serif;
            color: white;
        }

        .ui-container {
            position: absolute;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
        }

        .current-word {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
            min-height: 48px;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .btn-submit { background-color: #2ed573; color: black; }
        .btn-submit:hover { background-color: #26af5f; }
        .btn-clear { background-color: #ff4757; color: white; }
        .btn-clear:hover { background-color: #d63c4a; }

        .message {
            position: absolute;
            top: 40px;
            font-size: 1.2rem;
            font-weight: 500;
            min-height: 30px;
            color: #ffd43b;
            text-align: center;
            padding: 0 20px;
        }

        .cube-stage {
            position: relative;
            width: 420px;
            height: 420px;
            margin-bottom: 100px;
        }

        .scene {
            position: absolute;
            top: 105px;
            left: 105px;
            width: 210px;
            height: 210px;
            perspective: 600px;
            pointer-events: none;
            z-index: 1;
        }

        .rotate-controls {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
        }

        .rotate-btn {
            position: absolute;
            width: 32px;
            height: 32px;
            padding: 0;
            border: none;
            border-radius: 4px;
            background: rgba(18, 18, 18, 0.75);
            color: #ff4757;
            font-size: 1.25rem;
            font-weight: bold;
            line-height: 1;
            cursor: pointer;
            pointer-events: auto;
            transform: translate(-50%, -50%);
            transition: transform 0.15s, color 0.15s, background 0.15s;
        }

        .rotate-btn:hover {
            color: #ff6b7a;
            transform: translate(-50%, -50%) scale(1.2);
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-25deg) rotateY(45deg);
            transition: transform 0.05s ease-out;
        }

        .face {
            position: absolute;
            width: 210px;
            height: 210px;
            background: #000000;
            padding: 6px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
            backface-visibility: hidden;
        }

        .sticker {
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000000;
            text-transform: uppercase;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.1s, opacity 0.3s;
        }

        .sticker.selected {
            transform: scale(0.9);
            border: 3px solid #ffffff;
            color: #ffffff !important;
            background-color: #333333 !important;
        }

        .sticker.cleared {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* 3D Transform Space positions matching standard fold coordinates */
        .front  { transform: rotateY(  0deg) translateZ(105px); }
        .back   { transform: rotateY(180deg) translateZ(105px); }
        .right  { transform: rotateY( 90deg) translateZ(105px); }
        .left   { transform: rotateY(-90deg) translateZ(105px); }
        .top    { transform: rotateX( 90deg) translateZ(105px); }
        .bottom { transform: rotateX(-90deg) translateZ(105px); }

        .color-white  { background-color: #ffffff; }
        .color-yellow { background-color: #ffd43b; }
        .color-green  { background-color: #009e60; }
        .color-blue   { background-color: #0051ba; }
        .color-red    { background-color: #b71234; }
        .color-orange { background-color: #ff5800; }
    </style>
</head>
<body>

    <div class="message" id="message">Drag to spin the view. Use red arrows to rotate rows and columns.</div>

    <div class="cube-stage">
        <div class="rotate-controls" id="rotate-controls" aria-label="Cube rotation controls"></div>
        <div class="scene">
            <div class="cube" id="cube">
                <div class="face front" data-face="front" data-color="color-white"></div>
                <div class="face back" data-face="back" data-color="color-yellow"></div>
                <div class="face right" data-face="right" data-color="color-red"></div>
                <div class="face left" data-face="left" data-color="color-orange"></div>
                <div class="face top" data-face="top" data-color="color-blue"></div>
                <div class="face bottom" data-face="bottom" data-color="color-green"></div>
            </div>
        </div>
    </div>

    <div class="ui-container">
        <div class="current-word" id="current-word"></div>
        <div class="btn-group">
            <button class="btn-clear" onclick="clearSelection()">Clear</button>
            <button class="btn-submit" onclick="submitWord()">Submit</button>
        </div>
    </div>

    <script src="cubex_dictionary.js"></script>
    <script>
        const letters = "AAAAAAAAABBCCDDDDEEEEEEEEEEEEFFGGGHHIIIIIIIIIJKLLLLMMNNNNNNOOOOOOOOPPQRRRRRRSSSSSSTTTTTTUUUUVVWWXYYZ";
        const FACE_NAMES = ['front', 'back', 'right', 'left', 'top', 'bottom'];
        const COLOR_CLASSES = ['color-white', 'color-yellow', 'color-red', 'color-orange', 'color-blue', 'color-green'];
        const stickerMap = {};
        const cubeState = {};
        let selectedStickers = [];
        let suppressClickAfterDrag = false;
        let isLayerRotating = false;
        let currentRotation = { x: -25, y: 45 };
        const STAGE_SIZE = 420;
        const SCENE_OFFSET = 105;
        const ARROW_INSET = 6;

        // --- 3D ADJACENCY MAP (THE RUBIK HINGE MATH) ---
        // Maps the boundary rows/columns of each face to their neighbor coordinates
        const faceAdjacency = {
            front: {
                top:    { face: 'top',    indices: [6, 7, 8] }, // Bottom row of top
                bottom: { face: 'bottom', indices: [0, 1, 2] }, // Top row of bottom
                left:   { face: 'left',   indices: [2, 5, 8] }, // Right col of left
                right:  { face: 'right',  indices: [0, 3, 6] }  // Left col of right
            },
            back: {
                top:    { face: 'top',    indices: [2, 1, 0] },
                bottom: { face: 'bottom', indices: [8, 7, 6] },
                left:   { face: 'right',  indices: [2, 5, 8] },
                right:  { face: 'left',   indices: [0, 3, 6] }
            },
            right: {
                top:    { face: 'top',    indices: [8, 5, 2] },
                bottom: { face: 'bottom', indices: [2, 5, 8] },
                left:   { face: 'front',  indices: [2, 5, 8] },
                right:  { face: 'back',   indices: [0, 3, 6] }
            },
            left: {
                top:    { face: 'top',    indices: [0, 3, 6] },
                bottom: { face: 'bottom', indices: [6, 3, 0] },
                left:   { face: 'back',   indices: [2, 5, 8] },
                right:  { face: 'front',  indices: [0, 3, 6] }
            },
            top: {
                top:    { face: 'back',   indices: [2, 1, 0] },
                bottom: { face: 'front',  indices: [0, 1, 2] },
                left:   { face: 'left',   indices: [0, 1, 2] },
                right:  { face: 'right',  indices: [2, 1, 0] }
            },
            bottom: {
                top:    { face: 'front',  indices: [6, 7, 8] },
                bottom: { face: 'back',   indices: [6, 7, 8] },
                left:   { face: 'left',   indices: [6, 7, 8] },
                right:  { face: 'right',  indices: [6, 7, 8] }
            }
        };

        // --- RUBIK LAYER ROTATION ENGINE ---
        const FACE_NORMALS = {
            front: [0, 0, 1], back: [0, 0, -1], right: [1, 0, 0],
            left: [-1, 0, 0], top: [0, -1, 0], bottom: [0, 1, 0]
        };

        const FACE_RIGHT = {
            front: [1, 0, 0], back: [-1, 0, 0], right: [0, 0, -1],
            left: [0, 0, 1], top: [1, 0, 0], bottom: [1, 0, 0]
        };

        const FACE_UP = {
            front: [0, 1, 0], back: [0, 1, 0], right: [0, 1, 0],
            left: [0, 1, 0], top: [0, 0, -1], bottom: [0, 0, 1]
        };

        const FACE_REMAP = {
            front:  { front: 'front', right: 'right', back: 'back', left: 'left', top: 'top', bottom: 'bottom' },
            right:  { front: 'right', right: 'back', back: 'left', left: 'front', top: 'top', bottom: 'bottom' },
            back:   { front: 'back', right: 'left', back: 'front', left: 'right', top: 'top', bottom: 'bottom' },
            left:   { front: 'left', right: 'front', back: 'right', left: 'back', top: 'top', bottom: 'bottom' },
            top:    { front: 'top', right: 'right', back: 'bottom', left: 'left', top: 'back', bottom: 'front' },
            bottom: { front: 'bottom', right: 'right', back: 'top', left: 'left', top: 'front', bottom: 'back' }
        };

        const INDEX_REMAP = {
            front:  [0, 1, 2, 3, 4, 5, 6, 7, 8],
            right:  [0, 1, 2, 3, 4, 5, 6, 7, 8],
            back:   [0, 1, 2, 3, 4, 5, 6, 7, 8],
            left:   [0, 1, 2, 3, 4, 5, 6, 7, 8],
            top:    [6, 3, 0, 7, 4, 1, 8, 5, 2],
            bottom: [2, 5, 8, 1, 4, 7, 0, 3, 6]
        };

        function rotateFaceCycles(face, clockwise) {
            const corners = clockwise
                ? [{ face, idx: 0 }, { face, idx: 2 }, { face, idx: 8 }, { face, idx: 6 }]
                : [{ face, idx: 0 }, { face, idx: 6 }, { face, idx: 8 }, { face, idx: 2 }];
            const edges = clockwise
                ? [{ face, idx: 1 }, { face, idx: 5 }, { face, idx: 7 }, { face, idx: 3 }]
                : [{ face, idx: 1 }, { face, idx: 3 }, { face, idx: 7 }, { face, idx: 5 }];
            return [corners, edges];
        }

        const FRONT_MOVES = {
            row0right: [
                [{ face: 'front', idx: 0 }, { face: 'front', idx: 1 }, { face: 'front', idx: 2 },
                 { face: 'right', idx: 0 }, { face: 'right', idx: 1 }, { face: 'right', idx: 2 },
                 { face: 'back', idx: 2 }, { face: 'back', idx: 1 }, { face: 'back', idx: 0 },
                 { face: 'left', idx: 2 }, { face: 'left', idx: 1 }, { face: 'left', idx: 0 }],
                ...rotateFaceCycles('top', false)
            ],
            row1right: [
                [{ face: 'front', idx: 3 }, { face: 'front', idx: 4 }, { face: 'front', idx: 5 },
                 { face: 'right', idx: 3 }, { face: 'right', idx: 4 }, { face: 'right', idx: 5 },
                 { face: 'back', idx: 5 }, { face: 'back', idx: 4 }, { face: 'back', idx: 3 },
                 { face: 'left', idx: 3 }, { face: 'left', idx: 4 }, { face: 'left', idx: 5 }]
            ],
            row2right: [
                [{ face: 'front', idx: 6 }, { face: 'front', idx: 7 }, { face: 'front', idx: 8 },
                 { face: 'right', idx: 6 }, { face: 'right', idx: 7 }, { face: 'right', idx: 8 },
                 { face: 'back', idx: 8 }, { face: 'back', idx: 7 }, { face: 'back', idx: 6 },
                 { face: 'left', idx: 6 }, { face: 'left', idx: 7 }, { face: 'left', idx: 8 }],
                ...rotateFaceCycles('bottom', true)
            ],
            col0down: [
                [{ face: 'front', idx: 0 }, { face: 'front', idx: 3 }, { face: 'front', idx: 6 },
                 { face: 'bottom', idx: 0 }, { face: 'bottom', idx: 3 }, { face: 'bottom', idx: 6 },
                 { face: 'back', idx: 8 }, { face: 'back', idx: 5 }, { face: 'back', idx: 2 },
                 { face: 'top', idx: 0 }, { face: 'top', idx: 3 }, { face: 'top', idx: 6 }],
                ...rotateFaceCycles('left', true)
            ],
            col1down: [
                [{ face: 'front', idx: 1 }, { face: 'front', idx: 4 }, { face: 'front', idx: 7 },
                 { face: 'bottom', idx: 1 }, { face: 'bottom', idx: 4 }, { face: 'bottom', idx: 7 },
                 { face: 'back', idx: 7 }, { face: 'back', idx: 4 }, { face: 'back', idx: 1 },
                 { face: 'top', idx: 1 }, { face: 'top', idx: 4 }, { face: 'top', idx: 7 }]
            ],
            col2down: [
                [{ face: 'front', idx: 2 }, { face: 'front', idx: 5 }, { face: 'front', idx: 8 },
                 { face: 'bottom', idx: 2 }, { face: 'bottom', idx: 5 }, { face: 'bottom', idx: 8 },
                 { face: 'back', idx: 6 }, { face: 'back', idx: 3 }, { face: 'back', idx: 0 },
                 { face: 'top', idx: 2 }, { face: 'top', idx: 5 }, { face: 'top', idx: 8 }],
                ...rotateFaceCycles('right', true)
            ]
        };

        FRONT_MOVES.row0left = FRONT_MOVES.row0right.map(cycle => [...cycle].reverse());
        FRONT_MOVES.row1left = FRONT_MOVES.row1right.map(cycle => [...cycle].reverse());
        FRONT_MOVES.row2left = FRONT_MOVES.row2right.map(cycle => [...cycle].reverse());
        FRONT_MOVES.col0up = FRONT_MOVES.col0down.map(cycle => [...cycle].reverse());
        FRONT_MOVES.col1up = FRONT_MOVES.col1down.map(cycle => [...cycle].reverse());
        FRONT_MOVES.col2up = FRONT_MOVES.col2down.map(cycle => [...cycle].reverse());

        function localToWorldSlot(localFace, localIdx, dominantFace) {
            return {
                face: FACE_REMAP[dominantFace][localFace],
                idx: INDEX_REMAP[dominantFace][localIdx]
            };
        }

        function applyCycleToState(cycle, dominantFace) {
            const worldSlots = cycle.map(pos => localToWorldSlot(pos.face, pos.idx, dominantFace));
            const snapshot = worldSlots.map(pos => ({ ...cubeState[pos.face][pos.idx] }));
            for (let i = 0; i < worldSlots.length; i++) {
                const src = (i - 1 + worldSlots.length) % worldSlots.length;
                const target = worldSlots[i];
                cubeState[target.face][target.idx] = { ...snapshot[src] };
            }
        }

        function applyFrontMove(moveKey, dominantFace) {
            FRONT_MOVES[moveKey].forEach(cycle => applyCycleToState(cycle, dominantFace));
        }

        function transformVector(vec, rxDeg, ryDeg) {
            const rx = rxDeg * Math.PI / 180;
            const ry = ryDeg * Math.PI / 180;
            let x = Array.isArray(vec) ? vec[0] : vec.x;
            let y = Array.isArray(vec) ? vec[1] : vec.y;
            let z = Array.isArray(vec) ? vec[2] : vec.z;
            const x1 = x * Math.cos(ry) + z * Math.sin(ry);
            const z1 = -x * Math.sin(ry) + z * Math.cos(ry);
            x = x1;
            z = z1;
            const y1 = y * Math.cos(rx) - z * Math.sin(rx);
            z = y * Math.sin(rx) + z * Math.cos(rx);
            return { x, y: y1, z };
        }

        function dot3(a, b) {
            return a.x * b.x + a.y * b.y + a.z * b.z;
        }

        function getDominantFace() {
            let dominant = 'front';
            let bestZ = -Infinity;
            for (const face of FACE_NAMES) {
                const rotated = transformVector(FACE_NORMALS[face], currentRotation.x, currentRotation.y);
                if (rotated.z > bestZ) {
                    bestZ = rotated.z;
                    dominant = face;
                }
            }
            return dominant;
        }

        function getFaceBasisInView(face) {
            return {
                right: transformVector(FACE_RIGHT[face], currentRotation.x, currentRotation.y),
                up: transformVector(FACE_UP[face], currentRotation.x, currentRotation.y)
            };
        }

        function getScreenDirection3D(screenX, screenY) {
            const rx = -currentRotation.x * Math.PI / 180;
            const ry = -currentRotation.y * Math.PI / 180;
            let x = screenX;
            let y = screenY;
            let z = 0;
            const y1 = y * Math.cos(rx) - z * Math.sin(rx);
            const z1 = y * Math.sin(rx) + z * Math.cos(rx);
            y = y1;
            z = z1;
            const x1 = x * Math.cos(ry) + z * Math.sin(ry);
            const z2 = -x * Math.sin(ry) + z * Math.cos(ry);
            return { x: x1, y, z: z2 };
        }

        function resolveRowMove(line, screenDir) {
            const dominant = getDominantFace();
            const basis = getFaceBasisInView(dominant);
            const screenVec = getScreenDirection3D(screenDir === 'left' ? -1 : 1, 0);
            const faceRight = basis.right;
            const aligned = dot3(faceRight, screenVec) >= 0;
            const moveRight = screenDir === 'right' ? aligned : !aligned;
            return `row${line}${moveRight ? 'right' : 'left'}`;
        }

        function resolveColMove(line, screenDir) {
            const dominant = getDominantFace();
            const basis = getFaceBasisInView(dominant);
            const screenVec = getScreenDirection3D(0, screenDir === 'up' ? -1 : 1);
            const faceUp = basis.up;
            const aligned = dot3(faceUp, screenVec) >= 0;
            const moveDown = screenDir === 'down' ? aligned : !aligned;
            return `col${line}${moveDown ? 'down' : 'up'}`;
        }

        function renderCube() {
            FACE_NAMES.forEach(face => {
                for (let i = 0; i < 9; i++) {
                    const sticker = stickerMap[face][i];
                    const state = cubeState[face][i];
                    sticker.textContent = state.letter;
                    sticker.classList.toggle('cleared', state.cleared);
                    sticker.classList.toggle('selected', state.selected);
                    COLOR_CLASSES.forEach(colorClass => sticker.classList.remove(colorClass));
                    sticker.classList.add(state.color);
                }
            });
            selectedStickers = selectedStickers.filter(sticker => {
                if (!sticker.classList.contains('selected')) return false;
                return !sticker.classList.contains('cleared');
            });
        }

        function rotateLayer(kind, line, screenDir) {
            if (isLayerRotating) return;
            isLayerRotating = true;
            suppressClickAfterDrag = false;
            clearSelection();
            const dominantFace = getDominantFace();
            const moveKey = kind === 'row'
                ? resolveRowMove(line, screenDir)
                : resolveColMove(line, screenDir);
            if (!FRONT_MOVES[moveKey]) {
                isLayerRotating = false;
                return;
            }
            applyFrontMove(moveKey, dominantFace);
            renderCube();
            isLayerRotating = false;
        }

        function buildRotationControls() {
            const container = document.getElementById('rotate-controls');
            const cell = 210 / 3;

            const addButton = (kind, line, direction, symbol, x, y) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'rotate-btn';
                button.textContent = symbol;
                button.title = `Rotate ${kind} ${line + 1} toward screen ${direction}`;
                button.style.left = `${x}px`;
                button.style.top = `${y}px`;
                button.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                });
                button.addEventListener('touchstart', (e) => {
                    e.stopPropagation();
                }, { passive: true });
                button.addEventListener('click', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    rotateLayer(kind, line, direction);
                });
                container.appendChild(button);
            };

            for (let row = 0; row < 3; row++) {
                const y = SCENE_OFFSET + row * cell + cell / 2;
                addButton('row', row, 'left', '◀', ARROW_INSET, y);
                addButton('row', row, 'right', '▶', STAGE_SIZE - ARROW_INSET, y);
            }

            for (let col = 0; col < 3; col++) {
                const x = SCENE_OFFSET + col * cell + cell / 2;
                addButton('col', col, 'up', '▲', x, ARROW_INSET);
                addButton('col', col, 'down', '▼', x, STAGE_SIZE - ARROW_INSET);
            }
        }

        // Initialize Cube
        document.querySelectorAll('.face').forEach(face => {
            const baseColor = face.getAttribute('data-color');
            const faceName = face.getAttribute('data-face');
            stickerMap[faceName] = [];
            cubeState[faceName] = [];

            for (let i = 0; i < 9; i++) {
                const sticker = document.createElement('div');
                sticker.classList.add('sticker', baseColor);
                const letter = letters[Math.floor(Math.random() * letters.length)];
                sticker.textContent = letter;

                sticker.dataset.face = faceName;
                sticker.dataset.index = i;

                cubeState[faceName][i] = {
                    letter,
                    color: baseColor,
                    cleared: false,
                    selected: false
                };

                sticker.addEventListener('click', (e) => handleStickerClick(e, sticker));
                face.appendChild(sticker);
                stickerMap[faceName][i] = sticker;
            }
        });

        buildRotationControls();

        function getBoundaryEdges(face, row, col) {
            const bounds = faceAdjacency[face];
            const edges = [];
            if (row === 0) edges.push(bounds.top);
            if (row === 2) edges.push(bounds.bottom);
            if (col === 0) edges.push(bounds.left);
            if (col === 2) edges.push(bounds.right);
            return edges;
        }

        // 3D Adjacency Engine Validation
        function isAdjacent3D(lastSticker, nextSticker) {
            const f1 = lastSticker.dataset.face;
            const idx1 = parseInt(lastSticker.dataset.index);
            const f2 = nextSticker.dataset.face;
            const idx2 = parseInt(nextSticker.dataset.index);

            const r1 = Math.floor(idx1 / 3), c1 = idx1 % 3;
            const r2 = Math.floor(idx2 / 3), c2 = idx2 % 3;

            if (f1 === f2) {
                return Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1;
            }

            const edges = getBoundaryEdges(f1, r1, c1);
            return edges.some(edge => edge.face === f2 && edge.indices.includes(idx2));
        }

        function handleStickerClick(e, sticker) {
            e.stopPropagation();
            if (suppressClickAfterDrag) {
                suppressClickAfterDrag = false;
                return;
            }
            if (sticker.classList.contains('cleared')) return;

            const selectedIndex = selectedStickers.indexOf(sticker);
            if (selectedIndex !== -1) {
                selectedStickers.splice(selectedIndex).forEach(s => {
                    s.classList.remove('selected');
                    cubeState[s.dataset.face][Number(s.dataset.index)].selected = false;
                });
                updateWordDisplay();
                return;
            }

            if (selectedStickers.length > 0) {
                const last = selectedStickers[selectedStickers.length - 1];
                if (!isAdjacent3D(last, sticker)) {
                    showMessage("Letters must be physically adjacent across the 3D grid!");
                    return;
                }
            }

            sticker.classList.add('selected');
            cubeState[sticker.dataset.face][Number(sticker.dataset.index)].selected = true;
            selectedStickers.push(sticker);
            updateWordDisplay();
        }

        function updateWordDisplay() {
            const word = selectedStickers.map(s => s.textContent).join('');
            document.getElementById('current-word').textContent = word;
        }

        function clearSelection() {
            selectedStickers.forEach(s => {
                s.classList.remove('selected');
                cubeState[s.dataset.face][Number(s.dataset.index)].selected = false;
            });
            selectedStickers = [];
            updateWordDisplay();
        }

        function submitWord() {
            const currentWord = selectedStickers.map(s => s.textContent).join('');
            
            if (currentWord.length < 2 || currentWord.length > 12) {
                showMessage("Words must be between 2 and 12 letters long.");
                return;
            }

            if (wordSet.has(currentWord.toUpperCase())) {
                showMessage(`Valid 3D Word: ${currentWord}!`, "#2ed573");
                selectedStickers.forEach(s => {
                    const face = s.dataset.face;
                    const idx = Number(s.dataset.index);
                    s.classList.remove('selected');
                    s.classList.add('cleared');
                    cubeState[face][idx].selected = false;
                    cubeState[face][idx].cleared = true;
                });
                selectedStickers = [];
                updateWordDisplay();
            } else {
                showMessage(`"${currentWord}" not found in local dictionary.`, "#ff4757");
                clearSelection();
            }
        }

        function showMessage(txt, color = "#ffd43b") {
            const msgEl = document.getElementById('message');
            msgEl.textContent = txt;
            msgEl.style.color = color;
        }

        // Camera Drag Mechanics
        const cube = document.getElementById('cube');
        let isDragging = false;
        let dragDistance = 0;
        let previousPointer = { x: 0, y: 0 };
        const DRAG_CLICK_THRESHOLD = 5;

        function beginDrag(clientX, clientY) {
            isDragging = true;
            dragDistance = 0;
            suppressClickAfterDrag = false;
            previousPointer = { x: clientX, y: clientY };
        }

        function updateDrag(clientX, clientY) {
            if (!isDragging) return;
            const deltaMove = {
                x: clientX - previousPointer.x,
                y: clientY - previousPointer.y
            };
            dragDistance += Math.abs(deltaMove.x) + Math.abs(deltaMove.y);
            if (dragDistance > DRAG_CLICK_THRESHOLD) {
                suppressClickAfterDrag = true;
            }
            currentRotation.y += deltaMove.x * 0.4;
            currentRotation.x -= deltaMove.y * 0.4;
            cube.style.transform = `rotateX(${currentRotation.x}deg) rotateY(${currentRotation.y}deg)`;
            previousPointer = { x: clientX, y: clientY };
        }

        function endDrag() {
            isDragging = false;
        }

        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('.rotate-btn')) return;
            beginDrag(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => updateDrag(e.clientX, e.clientY));
        window.addEventListener('mouseup', endDrag);

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1 || e.target.closest('.rotate-btn')) return;
            beginDrag(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length !== 1) return;
            updateDrag(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        window.addEventListener('touchend', endDrag);
    </script>
</body>
</html>
