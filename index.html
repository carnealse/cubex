<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            user-select: none;
            touch-action: none;
        }

        .viewport {
            width: 360px;
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 700px;
            perspective-origin: 50% 50%;
            cursor: grab;
        }

        .viewport.is-dragging {
            cursor: grabbing;
        }

        .viewport.is-selecting {
            cursor: crosshair;
        }

        .cube {
            width: 210px;
            height: 210px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(0deg) rotateY(0deg);
        }

        .face {
            position: absolute;
            width: 210px;
            height: 210px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            padding: 4px;
            background: #000;
            border-radius: 6px;
            backface-visibility: hidden;
        }

        .sticker {
            border-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 0.35);
            pointer-events: none;
        }

        .sticker.slice-highlight {
            outline: 3px solid rgba(255, 255, 255, 0.95);
            outline-offset: -1px;
            filter: brightness(1.3);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.75);
            z-index: 2;
        }

        .face[data-face="front"]  { transform: rotateY(0deg) translateZ(105px); }
        .face[data-face="back"]   { transform: rotateY(180deg) translateZ(105px); }
        .face[data-face="right"]  { transform: rotateY(90deg) translateZ(105px); }
        .face[data-face="left"]   { transform: rotateY(-90deg) translateZ(105px); }
        .face[data-face="top"]    { transform: rotateX(90deg) translateZ(105px); }
        .face[data-face="bottom"] { transform: rotateX(-90deg) translateZ(105px); }
    </style>
</head>
<body>
    <div class="viewport" id="viewport">
        <div class="cube" id="cube"></div>
    </div>

    <script>
        const FACE_NAMES = ['front', 'back', 'right', 'left', 'top', 'bottom'];
        const PERSPECTIVE_PX = 700;
        const CUBE_UNIT_PX = 105;
        const MIN_RING_HITS = 3;

        const COLORS = {
            front:  '#009b48',
            back:   '#0046ad',
            right:  '#b71234',
            left:   '#ff5800',
            top:    '#ffffff',
            bottom: '#ffd500'
        };

        const FACE_BASIS = {
            front:  { n: [0, 0, 1],  right: [1, 0, 0],  down: [0, -1, 0] },
            back:   { n: [0, 0, -1], right: [-1, 0, 0], down: [0, -1, 0] },
            right:  { n: [1, 0, 0],  right: [0, 0, -1], down: [0, -1, 0] },
            left:   { n: [-1, 0, 0], right: [0, 0, 1],  down: [0, -1, 0] },
            top:    { n: [0, 1, 0],  right: [1, 0, 0],  down: [0, 0, -1] },
            bottom: { n: [0, -1, 0], right: [1, 0, 0],  down: [0, 0, 1] }
        };

        const cube = document.getElementById('cube');
        const stickers = {};
        let SLICE_RINGS = { column: [], row: [] };
        let lockedSlice = null;

        function buildColumnRing(index) {
            const col = index;
            const backCol = 2 - col;
            const ring = [];
            for (let row = 0; row < 3; row++) {
                ring.push(
                    { face: 'front', row, col },
                    { face: 'top', row: 2 - row, col },
                    { face: 'back', row: 2 - row, col: backCol },
                    { face: 'bottom', row: 2 - row, col }
                );
            }
            return ring;
        }

        function buildRowRing(index) {
            const row = index;
            const ring = [];
            for (let col = 0; col < 3; col++) {
                ring.push(
                    { face: 'front', row, col },
                    { face: 'right', row, col },
                    { face: 'back', row, col: 2 - col },
                    { face: 'left', row, col: 2 - col }
                );
            }
            return ring;
        }

        function buildSliceRings() {
            SLICE_RINGS = {
                column: [0, 1, 2].map((index) => buildColumnRing(index)),
                row: [0, 1, 2].map((index) => buildRowRing(index))
            };
        }

        function stickerId(face, row, col) {
            return `${face}:${row}:${col}`;
        }

        function faceletKey(face, row, col) {
            return stickerId(face, row, col);
        }

        function ringContainsSticker(ring, face, row, col) {
            return ring.some((entry) => entry.face === face && entry.row === row && entry.col === col);
        }

        function add3(a, b) {
            return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
        }

        function sub3(a, b) {
            return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
        }

        function scale3(v, s) {
            return [v[0] * s, v[1] * s, v[2] * s];
        }

        function dot3(a, b) {
            return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
        }

        function normalize3(v) {
            const len = Math.hypot(v[0], v[1], v[2]) || 1;
            return [v[0] / len, v[1] / len, v[2] / len];
        }

        function viewTransformVec(vec, rxDeg, ryDeg) {
            const rx = rxDeg * Math.PI / 180;
            const ry = ryDeg * Math.PI / 180;
            let x = vec[0];
            let y = vec[1];
            let z = vec[2];
            const y1 = y * Math.cos(rx) - z * Math.sin(rx);
            z = y * Math.sin(rx) + z * Math.cos(rx);
            y = y1;
            const x1 = x * Math.cos(ry) + z * Math.sin(ry);
            z = -x * Math.sin(ry) + z * Math.cos(ry);
            return [x1, y, z];
        }

        function raycastFacelet(clientX, clientY) {
            const rect = viewport.getBoundingClientRect();
            const sx = clientX - rect.left - rect.width / 2;
            const sy = clientY - rect.top - rect.height / 2;
            const rayDir = normalize3([sx / PERSPECTIVE_PX, -sy / PERSPECTIVE_PX, -1]);
            const rayOrig = [0, 0, PERSPECTIVE_PX / CUBE_UNIT_PX];

            let best = null;
            let bestDepth = -Infinity;

            FACE_NAMES.forEach((face) => {
                const basis = FACE_BASIS[face];
                const center = viewTransformVec(scale3(basis.n, 1.5), rotation.x, rotation.y);
                const normal = normalize3(viewTransformVec(basis.n, rotation.x, rotation.y));
                const right = viewTransformVec(basis.right, rotation.x, rotation.y);
                const down = viewTransformVec(basis.down, rotation.x, rotation.y);

                const denom = dot3(rayDir, normal);
                if (denom >= -0.001) {
                    return;
                }

                const t = dot3(sub3(center, rayOrig), normal) / denom;
                if (t < 0) {
                    return;
                }

                const hit = add3(rayOrig, scale3(rayDir, t));
                const rel = sub3(hit, center);
                const u = dot3(rel, right);
                const v = dot3(rel, down);
                if (u < -1.02 || u > 1.02 || v < -1.02 || v > 1.02) {
                    return;
                }

                if (hit[2] <= bestDepth) {
                    return;
                }

                const col = Math.min(2, Math.max(0, Math.floor(((u + 1) / 2) * 3)));
                const row = Math.min(2, Math.max(0, Math.floor(((v + 1) / 2) * 3)));

                bestDepth = hit[2];
                best = { face, row, col };
            });

            return best;
        }

        function removeHighlightVisuals() {
            document.querySelectorAll('.sticker.slice-highlight').forEach((stickerEl) => {
                stickerEl.classList.remove('slice-highlight');
            });
        }

        function applySliceHighlight(kind, index) {
            const ring = SLICE_RINGS[kind]?.[index] ?? [];
            ring.forEach(({ face, row, col }) => {
                const stickerEl = sticker(face, row, col);
                if (stickerEl) {
                    stickerEl.classList.add('slice-highlight');
                }
            });
        }

        function unlockHighlight() {
            lockedSlice = null;
            removeHighlightVisuals();
        }

        function lockSlice(kind, index) {
            lockedSlice = { kind, index };
            removeHighlightVisuals();
            applySliceHighlight(kind, index);
        }

        function countRingHits(hitMap, kind) {
            const counts = [0, 0, 0];
            hitMap.forEach((facelet) => {
                SLICE_RINGS[kind].forEach((ring, index) => {
                    if (ringContainsSticker(ring, facelet.face, facelet.row, facelet.col)) {
                        counts[index]++;
                    }
                });
            });
            return counts;
        }

        function bestRingIndex(counts) {
            let bestIndex = -1;
            let bestCount = 0;
            counts.forEach((count, index) => {
                if (count >= MIN_RING_HITS && count > bestCount) {
                    bestCount = count;
                    bestIndex = index;
                }
            });
            return bestIndex;
        }

        function resolveSliceFromDrag(hitMap, dx, dy) {
            if (hitMap.size < MIN_RING_HITS) {
                return null;
            }

            const horizontal = Math.abs(dx) >= Math.abs(dy);
            const rowCounts = countRingHits(hitMap, 'row');
            const columnCounts = countRingHits(hitMap, 'column');

            if (horizontal) {
                const rowIndex = bestRingIndex(rowCounts);
                if (rowIndex >= 0) {
                    return { kind: 'row', index: rowIndex };
                }
            } else {
                const columnIndex = bestRingIndex(columnCounts);
                if (columnIndex >= 0) {
                    return { kind: 'column', index: columnIndex };
                }
            }

            const rowIndex = bestRingIndex(rowCounts);
            const columnIndex = bestRingIndex(columnCounts);
            if (rowIndex >= 0 && columnIndex < 0) {
                return { kind: 'row', index: rowIndex };
            }
            if (columnIndex >= 0 && rowIndex < 0) {
                return { kind: 'column', index: columnIndex };
            }
            if (rowIndex >= 0 && columnIndex >= 0) {
                return rowCounts[rowIndex] >= columnCounts[columnIndex]
                    ? { kind: 'row', index: rowIndex }
                    : { kind: 'column', index: columnIndex };
            }

            return null;
        }

        function sampleDragHits(clientX, clientY, hitMap) {
            const hit = raycastFacelet(clientX, clientY);
            if (!hit) {
                return;
            }
            hitMap.set(faceletKey(hit.face, hit.row, hit.col), hit);
        }

        function buildCube() {
            FACE_NAMES.forEach((face) => {
                const faceEl = document.createElement('div');
                faceEl.className = 'face';
                faceEl.dataset.face = face;

                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 3; col++) {
                        const stickerEl = document.createElement('div');
                        stickerEl.className = 'sticker';
                        stickerEl.dataset.face = face;
                        stickerEl.dataset.row = String(row);
                        stickerEl.dataset.col = String(col);
                        stickerEl.dataset.index = String(row * 3 + col);
                        stickerEl.style.backgroundColor = COLORS[face];
                        faceEl.appendChild(stickerEl);
                        stickers[stickerId(face, row, col)] = stickerEl;
                    }
                }

                cube.appendChild(faceEl);
            });
        }

        function sticker(face, row, col) {
            return stickers[stickerId(face, row, col)] ?? null;
        }

        function bandStickers(face, kind, line) {
            const results = [];
            for (let i = 0; i < 3; i++) {
                const row = kind === 'row' ? line : i;
                const col = kind === 'col' ? line : i;
                const stickerEl = sticker(face, row, col);
                if (stickerEl) {
                    results.push(stickerEl);
                }
            }
            return results;
        }

        buildSliceRings();
        buildCube();

        const viewport = document.getElementById('viewport');
        const DEFAULT_ROTATION = { x: 0, y: 0 };
        let rotation = { ...DEFAULT_ROTATION };
        let activePointerId = null;
        let lastPointer = { x: 0, y: 0 };
        let pointerMode = null;
        let selectionStart = { x: 0, y: 0 };
        let selectionHits = new Map();

        function applyRotation() {
            cube.style.transform = `rotateX(${rotation.x}deg) rotateY(${rotation.y}deg)`;
        }

        function resetRotation() {
            rotation = { ...DEFAULT_ROTATION };
            applyRotation();
        }

        function updateSelectionPreview() {
            if (lockedSlice) {
                return;
            }
            const dx = lastPointer.x - selectionStart.x;
            const dy = lastPointer.y - selectionStart.y;
            const slice = resolveSliceFromDrag(selectionHits, dx, dy);
            removeHighlightVisuals();
            if (slice) {
                applySliceHighlight(slice.kind, slice.index);
            }
        }

        viewport.addEventListener('pointerdown', (event) => {
            if (event.button !== 0) {
                return;
            }

            activePointerId = event.pointerId;
            lastPointer = { x: event.clientX, y: event.clientY };
            const startHit = raycastFacelet(event.clientX, event.clientY);

            if (startHit) {
                pointerMode = 'rotate';
                viewport.classList.add('is-dragging');
            } else {
                pointerMode = 'select';
                selectionStart = { x: event.clientX, y: event.clientY };
                selectionHits = new Map();
                viewport.classList.add('is-selecting');
                if (!lockedSlice) {
                    removeHighlightVisuals();
                }
            }

            viewport.setPointerCapture(event.pointerId);
        });

        viewport.addEventListener('pointermove', (event) => {
            if (event.pointerId !== activePointerId) {
                return;
            }

            const dx = event.clientX - lastPointer.x;
            const dy = event.clientY - lastPointer.y;

            if (pointerMode === 'rotate') {
                rotation.y += dx * 0.5;
                rotation.x -= dy * 0.5;
                applyRotation();
            } else if (pointerMode === 'select') {
                sampleDragHits(event.clientX, event.clientY, selectionHits);
                sampleDragHits(
                    (lastPointer.x + event.clientX) / 2,
                    (lastPointer.y + event.clientY) / 2,
                    selectionHits
                );
                lastPointer = { x: event.clientX, y: event.clientY };
                updateSelectionPreview();
                return;
            }

            lastPointer = { x: event.clientX, y: event.clientY };
        });

        function endPointer(event) {
            if (event.pointerId !== activePointerId) {
                return;
            }

            if (pointerMode === 'select') {
                sampleDragHits(event.clientX, event.clientY, selectionHits);
                const dx = event.clientX - selectionStart.x;
                const dy = event.clientY - selectionStart.y;
                const slice = resolveSliceFromDrag(selectionHits, dx, dy);
                if (slice) {
                    lockSlice(slice.kind, slice.index);
                } else if (!lockedSlice) {
                    removeHighlightVisuals();
                } else {
                    applySliceHighlight(lockedSlice.kind, lockedSlice.index);
                }
            }

            pointerMode = null;
            activePointerId = null;
            selectionHits = new Map();
            viewport.classList.remove('is-dragging');
            viewport.classList.remove('is-selecting');

            if (viewport.hasPointerCapture(event.pointerId)) {
                viewport.releasePointerCapture(event.pointerId);
            }
        }

        viewport.addEventListener('pointerup', endPointer);
        viewport.addEventListener('pointercancel', endPointer);

        viewport.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            unlockHighlight();
        });

        applyRotation();

        window.cubeApi = {
            faces: FACE_NAMES,
            colors: COLORS,
            sticker,
            bandStickers,
            getRotation: () => ({ ...rotation }),
            setRotation: (x, y) => {
                rotation = { x, y };
                applyRotation();
            },
            resetRotation,
            getLockedSlice: () => (lockedSlice ? { ...lockedSlice } : null),
            unlockHighlight,
            raycastFacelet,
            resolveSliceFromDrag
        };
    </script>
</body>
</html>
