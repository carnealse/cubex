<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Letter Cube</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111318;
      font-family: Inter, Arial, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      gap: 8px;
    }
    button {
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 8px;
      padding: 7px 11px;
      background: #242936;
      color: #f3f5f9;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #303747; }
  </style>
</head>
<body>
  <div class="controls">
    <button id="scramble">Scramble</button>
    <button id="reset">Reset</button>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111318);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(6.4, 5.4, 7.6);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // Uniform lighting around the entire cube.
    scene.add(new THREE.AmbientLight(0xffffff, 3.2));

    const cubeRoot = new THREE.Group();
    scene.add(cubeRoot);

    const pivot = new THREE.Group();
    cubeRoot.add(pivot);

    const cubies = [];
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    const SIZE = 0.96;
    const STEP = 1.03;
    const STICKER_SIZE = 0.82;
    const STICKER_OFFSET = SIZE / 2 + 0.004;
    const TURN_SENSITIVITY = 0.012;
    const ORBIT_SENSITIVITY = 0.008;

    const COLOR = {
      right:  0xd62929,
      left:   0xf28c28,
      top:    0xf4f4f4,
      bottom: 0xf0d520,
      front:  0x1da64a,
      back:   0x275dd6,
      inside: 0x08090b
    };

    const FACE_DIRECTIONS = [
      { normal: new THREE.Vector3( 1, 0, 0), color: COLOR.right  },
      { normal: new THREE.Vector3(-1, 0, 0), color: COLOR.left   },
      { normal: new THREE.Vector3( 0, 1, 0), color: COLOR.top    },
      { normal: new THREE.Vector3( 0,-1, 0), color: COLOR.bottom },
      { normal: new THREE.Vector3( 0, 0, 1), color: COLOR.front  },
      { normal: new THREE.Vector3( 0, 0,-1), color: COLOR.back   }
    ];

    function material(color) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness: 0.42,
        metalness: 0.02
      });
    }

    function randomLetter() {
      return String.fromCharCode(65 + Math.floor(Math.random() * 26));
    }

    function textColorForBackground(color) {
      const r = (color >> 16) & 255;
      const g = (color >> 8) & 255;
      const b = color & 255;
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.62 ? '#111318' : '#f8f9fc';
    }

    function createLetterTexture(color, letter) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;

      const ctx = canvas.getContext('2d');
      ctx.fillStyle = `#${color.toString(16).padStart(6, '0')}`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = textColorForBackground(color);
      ctx.font = 'bold 152px Inter, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(letter, 128, 133);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function makeBasisQuaternion(normal, up) {
      const right = up.clone().cross(normal).normalize();
      const correctedUp = normal.clone().cross(right).normalize();
      const matrix = new THREE.Matrix4().makeBasis(right, correctedUp, normal);
      return new THREE.Quaternion().setFromRotationMatrix(matrix);
    }

    function canonicalUpForWorldFace(worldNormal) {
      const n = worldNormal.clone().round();

      // Side faces read upright relative to the screen/world vertical.
      if (Math.abs(n.y) < 0.5) return new THREE.Vector3(0, 1, 0);

      // Top and bottom need their own stable "up" direction.
      return n.y > 0
        ? new THREE.Vector3(0, 0, -1)
        : new THREE.Vector3(0, 0, 1);
    }

    function orientSticker(cubie, sticker) {
      const localNormal = sticker.userData.localNormal.clone();
      const worldNormal = localNormal.clone().applyQuaternion(cubie.quaternion).round();
      const desiredWorldUp = canonicalUpForWorldFace(worldNormal);

      const inverseCubieRotation = cubie.quaternion.clone().invert();
      const desiredLocalUp = desiredWorldUp.clone()
        .applyQuaternion(inverseCubieRotation)
        .normalize();

      sticker.quaternion.copy(makeBasisQuaternion(localNormal, desiredLocalUp));
    }

    function orientStickers(cubie) {
      cubie.userData.stickers.forEach(sticker => orientSticker(cubie, sticker));
    }

    function createSticker(cubie, normal, color) {
      const geometry = new THREE.PlaneGeometry(STICKER_SIZE, STICKER_SIZE);
      const material = new THREE.MeshBasicMaterial({
        map: createLetterTexture(color, randomLetter()),
        side: THREE.FrontSide
      });

      const sticker = new THREE.Mesh(geometry, material);
      sticker.position.copy(normal).multiplyScalar(STICKER_OFFSET);
      sticker.userData.localNormal = normal.clone();

      cubie.add(sticker);
      cubie.userData.stickers.push(sticker);
      orientSticker(cubie, sticker);
    }

    function createCubie(x, y, z) {
      const geometry = new THREE.BoxGeometry(SIZE, SIZE, SIZE);
      const bodyMaterial = material(COLOR.inside);
      const mesh = new THREE.Mesh(geometry, bodyMaterial);

      mesh.position.set(x * STEP, y * STEP, z * STEP);
      mesh.userData.home = { x, y, z };
      mesh.userData.grid = new THREE.Vector3(x, y, z);
      mesh.userData.stickers = [];

      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geometry),
        new THREE.LineBasicMaterial({ color: 0x020203 })
      );
      mesh.add(edges);

      cubeRoot.add(mesh);
      cubies.push(mesh);

      for (const face of FACE_DIRECTIONS) {
        const { normal, color } = face;
        const isVisible =
          (normal.x ===  1 && x ===  1) ||
          (normal.x === -1 && x === -1) ||
          (normal.y ===  1 && y ===  1) ||
          (normal.y === -1 && y === -1) ||
          (normal.z ===  1 && z ===  1) ||
          (normal.z === -1 && z === -1);

        if (isVisible) createSticker(mesh, normal, color);
      }

      return mesh;
    }

    for (let x = -1; x <= 1; x++) {
      for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) createCubie(x, y, z);
      }
    }

    let spherical = new THREE.Spherical();
    spherical.setFromVector3(camera.position);

    function updateCamera() {
      spherical.radius = THREE.MathUtils.clamp(spherical.radius, 5, 15);
      spherical.phi = THREE.MathUtils.clamp(spherical.phi, 0.16, Math.PI - 0.16);
      camera.position.setFromSpherical(spherical);
      camera.lookAt(0, 0, 0);
    }

    function setRay(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
    }

    function firstCubeHit(event) {
      setRay(event);
      return raycaster.intersectObjects(cubies, false)[0] ?? null;
    }

    function axisIndex(v) {
      const a = [Math.abs(v.x), Math.abs(v.y), Math.abs(v.z)];
      return a.indexOf(Math.max(...a));
    }

    function canonicalAxis(index) {
      return [
        new THREE.Vector3(1, 0, 0),
        new THREE.Vector3(0, 1, 0),
        new THREE.Vector3(0, 0, 1)
      ][index];
    }

    function component(v, index) {
      return index === 0 ? v.x : index === 1 ? v.y : v.z;
    }

    function projectAxisToScreen(axis) {
      const origin = new THREE.Vector3(0, 0, 0).project(camera);
      const tip = axis.clone().project(camera);
      return new THREE.Vector2(tip.x - origin.x, -(tip.y - origin.y)).normalize();
    }

    function roundGridPosition(mesh) {
      mesh.position.set(
        Math.round(mesh.position.x / STEP) * STEP,
        Math.round(mesh.position.y / STEP) * STEP,
        Math.round(mesh.position.z / STEP) * STEP
      );
      mesh.userData.grid.set(
        Math.round(mesh.position.x / STEP),
        Math.round(mesh.position.y / STEP),
        Math.round(mesh.position.z / STEP)
      );
    }

    function snapOrientation(mesh) {
      mesh.updateMatrix();
      const matrix = new THREE.Matrix4().makeRotationFromQuaternion(mesh.quaternion);
      const elements = matrix.elements;

      for (const index of [0,1,2,4,5,6,8,9,10]) {
        elements[index] = Math.abs(elements[index]) < 0.5
          ? 0
          : Math.sign(elements[index]);
      }

      mesh.quaternion.setFromRotationMatrix(matrix).normalize();
    }

    function attachSlice(axis, layer) {
      const selected = cubies.filter(cubie =>
        Math.round(component(cubie.userData.grid, axisIndex(axis))) === layer
      );

      selected.forEach(cubie => pivot.attach(cubie));
      return selected;
    }

    function detachSlice(selected) {
      selected.forEach(cubie => {
        cubeRoot.attach(cubie);
        roundGridPosition(cubie);
        snapOrientation(cubie);
        orientStickers(cubie);
      });

      pivot.quaternion.identity();
      pivot.rotation.set(0, 0, 0);
    }

    let gesture = null;
    let busy = false;

    renderer.domElement.addEventListener('pointerdown', event => {
      if (busy) return;

      renderer.domElement.setPointerCapture(event.pointerId);
      const hit = firstCubeHit(event);

      if (!hit) {
        gesture = {
          type: 'orbit',
          startX: event.clientX,
          startY: event.clientY,
          theta: spherical.theta,
          phi: spherical.phi
        };
        return;
      }

      const normalMatrix = new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld);
      const faceNormal = hit.face.normal.clone()
        .applyMatrix3(normalMatrix)
        .normalize()
        .round();

      gesture = {
        type: 'slice-pending',
        startX: event.clientX,
        startY: event.clientY,
        faceNormal,
        cubie: hit.object,
        axis: null,
        selected: null,
        angle: 0
      };
    });

    renderer.domElement.addEventListener('pointermove', event => {
      if (!gesture || busy) return;

      const dx = event.clientX - gesture.startX;
      const dy = event.clientY - gesture.startY;

      if (gesture.type === 'orbit') {
        spherical.theta = gesture.theta - dx * ORBIT_SENSITIVITY;
        spherical.phi = gesture.phi - dy * ORBIT_SENSITIVITY;
        updateCamera();
        return;
      }

      const drag = new THREE.Vector2(dx, dy);
      if (drag.length() < 5) return;

      if (gesture.type === 'slice-pending') {
        const normalAxis = axisIndex(gesture.faceNormal);
        const tangentAxes = [0, 1, 2].filter(index => index !== normalAxis);

        let best = null;

        for (const tangentIndex of tangentAxes) {
          const tangent = canonicalAxis(tangentIndex);
          const screen = projectAxisToScreen(tangent);
          const score = Math.abs(screen.dot(drag.clone().normalize()));

          if (!best || score > best.score) {
            best = { tangent, screen, score };
          }
        }

        const rotationAxis = gesture.faceNormal.clone()
          .cross(best.tangent)
          .normalize();

        const layer = Math.round(
          component(gesture.cubie.userData.grid, axisIndex(rotationAxis))
        );

        gesture.type = 'slice';
        gesture.axis = rotationAxis;
        gesture.screenTangent = best.screen;
        gesture.selected = attachSlice(rotationAxis, layer);
      }

      const pixelsAlongTurn = gesture.screenTangent.dot(drag);
      gesture.angle = THREE.MathUtils.clamp(
        pixelsAlongTurn * TURN_SENSITIVITY,
        -Math.PI * 0.62,
        Math.PI * 0.62
      );

      pivot.quaternion.setFromAxisAngle(gesture.axis, gesture.angle);
    });

    function animateSlice(targetAngle, selected, axis, startAngle) {
      busy = true;

      const duration = 150;
      const start = performance.now();

      function frame(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        const angle = THREE.MathUtils.lerp(startAngle, targetAngle, eased);

        pivot.quaternion.setFromAxisAngle(axis, angle);

        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          detachSlice(selected);
          busy = false;
        }
      }

      requestAnimationFrame(frame);
    }

    function endGesture() {
      if (!gesture || busy) return;

      if (gesture.type === 'slice') {
        const target = Math.abs(gesture.angle) < 0.22
          ? 0
          : Math.sign(gesture.angle) * Math.PI / 2;

        animateSlice(target, gesture.selected, gesture.axis, gesture.angle);
      }

      gesture = null;
    }

    renderer.domElement.addEventListener('pointerup', endGesture);
    renderer.domElement.addEventListener('pointercancel', endGesture);
    renderer.domElement.addEventListener('contextmenu', event => event.preventDefault());

    renderer.domElement.addEventListener('wheel', event => {
      event.preventDefault();
      spherical.radius += event.deltaY * 0.006;
      updateCamera();
    }, { passive: false });

    function applyQuarterTurn(axisIndexValue, layer, direction) {
      const axis = canonicalAxis(axisIndexValue);
      const selected = attachSlice(axis, layer);

      pivot.quaternion.setFromAxisAngle(axis, direction * Math.PI / 2);
      detachSlice(selected);
    }

    document.getElementById('scramble').addEventListener('click', () => {
      if (busy) return;

      for (let i = 0; i < 24; i++) {
        const axis = Math.floor(Math.random() * 3);
        const layer = Math.floor(Math.random() * 3) - 1;
        const direction = Math.random() < 0.5 ? -1 : 1;

        applyQuarterTurn(axis, layer, direction);
      }
    });

    document.getElementById('reset').addEventListener('click', () => {
      if (busy) return;

      cubies.forEach(cubie => {
        cubeRoot.attach(cubie);

        const { x, y, z } = cubie.userData.home;
        cubie.position.set(x * STEP, y * STEP, z * STEP);
        cubie.quaternion.identity();
        cubie.userData.grid.set(x, y, z);

        orientStickers(cubie);
      });

      pivot.quaternion.identity();
      pivot.rotation.set(0, 0, 0);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    updateCamera();
    animate();
  </script>
</body>
</html>
