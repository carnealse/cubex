<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Word Cube - Wordle Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            font-family: system-ui, -apple-system, sans-serif;
            color: white;
        }

        .ui-container {
            position: absolute;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
        }

        .current-word {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
            min-height: 48px;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .btn-submit { background-color: #2ed573; color: black; }
        .btn-submit:hover { background-color: #26af5f; }
        .btn-clear { background-color: #ff4757; color: white; }
        .btn-clear:hover { background-color: #d63c4a; }

        .message {
            position: absolute;
            top: 40px;
            font-size: 1.2rem;
            font-weight: 500;
            min-height: 30px;
            color: #ffd43b;
            text-align: center;
            padding: 0 20px;
        }

        .cube-stage {
            position: relative;
            width: 460px;
            height: 460px;
            margin-bottom: 100px;
        }

        .scene {
            position: absolute;
            top: 125px;
            left: 125px;
            width: 210px;
            height: 210px;
            perspective: 600px;
            pointer-events: none;
            z-index: 1;
        }

        .rotate-controls {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
        }

        .rotate-btn {
            position: absolute;
            width: 32px;
            height: 32px;
            padding: 0;
            border: none;
            border-radius: 4px;
            background: rgba(18, 18, 18, 0.75);
            color: #ff4757;
            font-size: 1.25rem;
            font-weight: bold;
            line-height: 1;
            cursor: pointer;
            pointer-events: auto;
            transform: translate(-50%, -50%);
            transition: transform 0.15s, color 0.15s, background 0.15s;
        }

        .rotate-btn:hover {
            color: #ff6b7a;
            transform: translate(-50%, -50%) scale(1.2);
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-25deg) rotateY(45deg);
            transition: transform 0.05s ease-out;
        }

        .face {
            position: absolute;
            width: 210px;
            height: 210px;
            background: #000000;
            padding: 6px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
            backface-visibility: hidden;
        }

        .sticker {
            position: relative;
            isolation: isolate;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000000;
            text-transform: uppercase;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.1s, opacity 0.3s;
        }

        .sticker::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 6px;
            z-index: -1;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease-out;
            background: radial-gradient(
                ellipse at center,
                rgba(255, 255, 255, 0.55) 0%,
                rgba(255, 255, 255, 0.2) 45%,
                transparent 72%
            );
            box-shadow:
                0 0 10px 3px rgba(255, 255, 255, 0.65),
                0 0 22px 8px rgba(255, 255, 255, 0.35);
        }

        .sticker.slice-preview-active::before {
            opacity: 1;
        }

        .sticker.selected {
            transform: scale(0.9);
            border: 3px solid #ffffff;
            color: #ffffff !important;
            background-color: #333333 !important;
        }

        .sticker.cleared {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* 3D Transform Space positions matching standard fold coordinates */
        .front  { transform: rotateY(  0deg) translateZ(105px); }
        .back   { transform: rotateY(180deg) translateZ(105px); }
        .right  { transform: rotateY( 90deg) translateZ(105px); }
        .left   { transform: rotateY(-90deg) translateZ(105px); }
        .top    { transform: rotateX( 90deg) translateZ(105px); }
        .bottom { transform: rotateX(-90deg) translateZ(105px); }

        .color-white  { background-color: #ffffff; }
        .color-yellow { background-color: #ffd43b; }
        .color-green  { background-color: #009e60; }
        .color-blue   { background-color: #0051ba; }
        .color-red    { background-color: #b71234; }
        .color-orange { background-color: #ff5800; }

    </style>
</head>
<body>

    <div class="message" id="message">Drag to spin the view. Hover arrows — the glow chases in the direction of the turn.</div>

    <div class="cube-stage">
        <div class="rotate-controls" id="rotate-controls" aria-label="Cube rotation controls"></div>
        <div class="scene">
            <div class="cube" id="cube">
                <div class="face front" data-face="front" data-color="color-white"></div>
                <div class="face back" data-face="back" data-color="color-yellow"></div>
                <div class="face right" data-face="right" data-color="color-red"></div>
                <div class="face left" data-face="left" data-color="color-orange"></div>
                <div class="face top" data-face="top" data-color="color-blue"></div>
                <div class="face bottom" data-face="bottom" data-color="color-green"></div>
            </div>
        </div>
    </div>

    <div class="ui-container">
        <div class="current-word" id="current-word"></div>
        <div class="btn-group">
            <button class="btn-clear" onclick="clearSelection()">Clear</button>
            <button class="btn-submit" onclick="submitWord()">Submit</button>
        </div>
    </div>

    <script src="cubex_dictionary.js"></script>
    <script>
        const letters = "AAAAAAAAABBCCDDDDEEEEEEEEEEEEFFGGGHHIIIIIIIIIJKLLLLMMNNNNNNOOOOOOOOPPQRRRRRRSSSSSSTTTTTTUUUUVVWWXYYZ";
        const FACE_NAMES = ['front', 'back', 'right', 'left', 'top', 'bottom'];
        const COLOR_CLASSES = ['color-white', 'color-yellow', 'color-red', 'color-orange', 'color-blue', 'color-green'];
        const stickerMap = {};
        const cubeState = {};
        let selectedStickers = [];
        let suppressClickAfterDrag = false;
        let isLayerRotating = false;
        let currentRotation = { x: -25, y: 45 };
        const STAGE_SIZE = 460;
        const SCENE_OFFSET = 125;
        const ARROW_INSET = 4;
        // --- 3D ADJACENCY MAP (THE RUBIK HINGE MATH) ---
        // Maps the boundary rows/columns of each face to their neighbor coordinates
        const faceAdjacency = {
            front: {
                top:    { face: 'top',    indices: [6, 7, 8] }, // Bottom row of top
                bottom: { face: 'bottom', indices: [0, 1, 2] }, // Top row of bottom
                left:   { face: 'left',   indices: [2, 5, 8] }, // Right col of left
                right:  { face: 'right',  indices: [0, 3, 6] }  // Left col of right
            },
            back: {
                top:    { face: 'top',    indices: [2, 1, 0] },
                bottom: { face: 'bottom', indices: [8, 7, 6] },
                left:   { face: 'right',  indices: [2, 5, 8] },
                right:  { face: 'left',   indices: [0, 3, 6] }
            },
            right: {
                top:    { face: 'top',    indices: [8, 5, 2] },
                bottom: { face: 'bottom', indices: [2, 5, 8] },
                left:   { face: 'front',  indices: [2, 5, 8] },
                right:  { face: 'back',   indices: [0, 3, 6] }
            },
            left: {
                top:    { face: 'top',    indices: [0, 3, 6] },
                bottom: { face: 'bottom', indices: [6, 3, 0] },
                left:   { face: 'back',   indices: [2, 5, 8] },
                right:  { face: 'front',  indices: [0, 3, 6] }
            },
            top: {
                top:    { face: 'back',   indices: [2, 1, 0] },
                bottom: { face: 'front',  indices: [0, 1, 2] },
                left:   { face: 'left',   indices: [0, 1, 2] },
                right:  { face: 'right',  indices: [2, 1, 0] }
            },
            bottom: {
                top:    { face: 'front',  indices: [6, 7, 8] },
                bottom: { face: 'back',   indices: [6, 7, 8] },
                left:   { face: 'left',   indices: [6, 7, 8] },
                right:  { face: 'right',  indices: [6, 7, 8] }
            }
        };

        // --- SLICE ROTATION ENGINE (18 slice objects, 3D-accurate permutations) ---
        const FACE_BASIS = {
            front:  { n: [0, 0, 1],  r: [1, 0, 0],  u: [0, 1, 0] },
            back:   { n: [0, 0, -1], r: [-1, 0, 0], u: [0, 1, 0] },
            right:  { n: [1, 0, 0],  r: [0, 0, -1], u: [0, 1, 0] },
            left:   { n: [-1, 0, 0], r: [0, 0, 1],  u: [0, 1, 0] },
            top:    { n: [0, -1, 0], r: [1, 0, 0],  u: [0, 0, -1] },
            bottom: { n: [0, 1, 0],  r: [1, 0, 0],  u: [0, 0, 1] }
        };

        const CUBE_AXES = {
            x: [1, 0, 0],
            y: [0, 1, 0],
            z: [0, 0, 1]
        };

        const ALL_STICKER_SLOTS = (() => {
            const slots = [];
            FACE_NAMES.forEach(face => {
                for (let idx = 0; idx < 9; idx++) {
                    slots.push({ face, idx, key: `${face}:${idx}`, pos: null });
                }
            });
            return slots;
        })();

        const LAYER_PERM_ATLAS = {};
        const FACE_BAND_AXIS = {
            front:  { col: 'x', row: 'y' },
            back:   { col: 'x', row: 'y' },
            left:   { col: 'z', row: 'y' },
            right:  { col: 'z', row: 'y' },
            top:    { col: 'x', row: 'z' },
            bottom: { col: 'x', row: 'z' }
        };
        function vecDot(a, b) {
            return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
        }

        function vecAdd(a, b) {
            return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
        }

        function vecScale(a, s) {
            return [a[0] * s, a[1] * s, a[2] * s];
        }

        function vecSub(a, b) {
            return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
        }

        function slotKey(face, idx) {
            return `${face}:${idx}`;
        }

        function slotPos(face, idx) {
            const row = Math.floor(idx / 3);
            const col = idx % 3;
            const u = col - 1;
            const v = 1 - row;
            const basis = FACE_BASIS[face];
            return vecAdd(vecScale(basis.n, 1.5), vecAdd(vecScale(basis.r, u), vecScale(basis.u, v)));
        }

        function refreshStickerPositions() {
            ALL_STICKER_SLOTS.forEach(slot => {
                slot.pos = slotPos(slot.face, slot.idx);
            });
        }

        function rotateAroundAxis(vec, axis, angle) {
            const [x, y, z] = vec;
            const [ax, ay, az] = axis;
            const c = Math.cos(angle);
            const s = Math.sin(angle);
            const oc = 1 - c;
            return [
                x * (c + oc * ax * ax) + y * (oc * ax * ay - s * az) + z * (oc * ax * az + s * ay),
                x * (oc * ax * ay + s * az) + y * (c + oc * ay * ay) + z * (oc * ay * az - s * ax),
                x * (oc * ax * az - s * ay) + y * (oc * ay * az + s * ax) + z * (c + oc * az * az)
            ];
        }

        function locateStickerByPosition(pos) {
            let best = null;
            let bestDist = Infinity;
            for (const face of FACE_NAMES) {
                const basis = FACE_BASIS[face];
                if (vecDot(pos, basis.n) <= 0.5) {
                    continue;
                }
                const rel = vecSub(pos, vecScale(basis.n, 1.5));
                const u = vecDot(rel, basis.r);
                const v = vecDot(rel, basis.u);
                const col = Math.max(0, Math.min(2, Math.round(u + 1)));
                const row = Math.max(0, Math.min(2, Math.round(1 - v)));
                const dist = Math.abs(u - (col - 1)) + Math.abs(v - (1 - row));
                if (dist < bestDist) {
                    bestDist = dist;
                    best = { face, idx: row * 3 + col };
                }
            }
            return best;
        }

        function identityPerm() {
            const perm = {};
            ALL_STICKER_SLOTS.forEach(slot => {
                perm[slot.key] = slot.key;
            });
            return perm;
        }

        function buildRodriguesSlicePerm(axisName, layerVal, sign) {
            const axis = CUBE_AXES[axisName];
            const angle = sign * Math.PI / 2;
            const perm = identityPerm();
            ALL_STICKER_SLOTS.forEach(slot => {
                if (Math.abs(vecDot(slot.pos, axis) - layerVal) > 0.55) {
                    return;
                }
                const dest = locateStickerByPosition(rotateAroundAxis(slot.pos, axis, angle));
                if (dest) {
                    perm[slotKey(dest.face, dest.idx)] = slot.key;
                }
            });
            return perm;
        }

        function layerStickerKeys(axisName, layerVal) {
            const axis = CUBE_AXES[axisName];
            return ALL_STICKER_SLOTS
                .filter(slot => Math.abs(vecDot(slot.pos, axis) - layerVal) < 0.55)
                .map(slot => slot.key);
        }

        function validateLayerPerm(perm, axisName, layerVal) {
            const keys = layerStickerKeys(axisName, layerVal);
            const destinations = keys.map(key => {
                return Object.entries(perm).find(([dest, src]) => src === key)?.[0];
            });
            if (destinations.some(dest => !dest)) {
                throw new Error(`Incomplete layer permutation for ${axisName}:${layerVal}`);
            }
            if (new Set(destinations).size !== destinations.length) {
                throw new Error(`Layer permutation collision for ${axisName}:${layerVal}`);
            }
        }

        function buildLayerPermAtlas() {
            ['x', 'y', 'z'].forEach(axisName => {
                [-1, 0, 1].forEach(layerVal => {
                    [1, -1].forEach(sign => {
                        const key = `${axisName}:${layerVal}:${sign}`;
                        const perm = buildRodriguesSlicePerm(axisName, layerVal, sign);
                        validateLayerPerm(perm, axisName, layerVal);
                        LAYER_PERM_ATLAS[key] = perm;
                    });
                });
            });
        }

        function bandIndices(kind, line) {
            return kind === 'col'
                ? [line, line + 3, line + 6]
                : [line * 3, line * 3 + 1, line * 3 + 2];
        }

        function snapLayerVal(value) {
            let best = 0;
            let bestDist = Infinity;
            [-1, 0, 1].forEach(val => {
                const dist = Math.abs(value - val);
                if (dist < bestDist) {
                    bestDist = dist;
                    best = val;
                }
            });
            return best;
        }

        // Matches CSS: rotateX(rx) rotateY(ry) — Rx first, then Ry.
        function viewTransform(vec, rxDeg, ryDeg) {
            const rx = rxDeg * Math.PI / 180;
            const ry = ryDeg * Math.PI / 180;
            let x = vec[0];
            let y = vec[1];
            let z = vec[2];
            const y1 = y * Math.cos(rx) - z * Math.sin(rx);
            z = y * Math.sin(rx) + z * Math.cos(rx);
            y = y1;
            const x1 = x * Math.cos(ry) + z * Math.sin(ry);
            z = -x * Math.sin(ry) + z * Math.cos(ry);
            return { x: x1, y, z };
        }

        function bandLayerFromFace(face, kind, line) {
            const midIdx = kind === 'col' ? line + 3 : line * 3 + 1;
            const axisName = FACE_BAND_AXIS[face][kind];
            const layerVal = snapLayerVal(vecDot(slotPos(face, midIdx), CUBE_AXES[axisName]));
            return { axisName, layerVal };
        }

        function isBandScreenAligned(face, kind, rxDeg, ryDeg) {
            const indices = bandIndices(kind, 0);
            const projected = indices.map(idx => viewTransform(slotPos(face, idx), rxDeg, ryDeg));
            const xs = projected.map(point => point.x);
            const ys = projected.map(point => point.y);
            const spreadX = Math.max(...xs) - Math.min(...xs);
            const spreadY = Math.max(...ys) - Math.min(...ys);
            if (kind === 'col') {
                return spreadX < spreadY * 0.55;
            }
            return spreadY < spreadX * 0.55;
        }

        function getControlFace(kind) {
            const rxDeg = currentRotation.x;
            const ryDeg = currentRotation.y;
            let controlFace = 'front';
            let bestZ = -Infinity;
            FACE_NAMES.forEach(face => {
                const viewZ = viewTransform(FACE_BASIS[face].n, rxDeg, ryDeg).z;
                if (viewZ < 0.2 || !isBandScreenAligned(face, kind, rxDeg, ryDeg)) {
                    return;
                }
                if (viewZ > bestZ) {
                    bestZ = viewZ;
                    controlFace = face;
                }
            });
            return controlFace;
        }

        let SLICE_OBJECTS = {};

        function buildSliceObjects() {
            const slices = {};
            ['x', 'y', 'z'].forEach(axisName => {
                [-1, 0, 1].forEach(layerVal => {
                    const id = `${axisName}:${layerVal}`;
                    slices[id] = {
                        id,
                        axisName,
                        layerVal,
                        stickerKeys: layerStickerKeys(axisName, layerVal),
                        permForSign(sign) {
                            return LAYER_PERM_ATLAS[`${axisName}:${layerVal}:${sign}`];
                        }
                    };
                });
            });
            return slices;
        }

        function pickSlice(kind, line) {
            const face = getControlFace(kind);
            return { face, line, ...bandLayerFromFace(face, kind, line) };
        }

        function edgeStickerIndex(kind, bandLine, screenDir) {
            if (kind === 'col') {
                return screenDir === 'up' ? bandLine : bandLine + 6;
            }
            return screenDir === 'right' ? bandLine * 3 + 2 : bandLine * 3;
        }

        function stickerOnSliceFrontmost(axisName, layerVal) {
            const axis = CUBE_AXES[axisName];
            let bestPos = null;
            let bestZ = -Infinity;
            ALL_STICKER_SLOTS.forEach(slot => {
                if (Math.abs(vecDot(slot.pos, axis) - layerVal) > 0.55) {
                    return;
                }
                const view = viewTransform(slot.pos, currentRotation.x, currentRotation.y);
                if (view.z > bestZ) {
                    bestZ = view.z;
                    bestPos = slot.pos;
                }
            });
            return bestPos;
        }

        function turnSignForSticker(kind, screenDir, testPos, rotAxis) {
            const startView = viewTransform(testPos, currentRotation.x, currentRotation.y);
            const screenScore = (sign) => {
                const endPos = rotateAroundAxis(testPos, rotAxis, sign * Math.PI / 2);
                const endView = viewTransform(endPos, currentRotation.x, currentRotation.y);
                if (kind === 'col') {
                    const dy = endView.y - startView.y;
                    return screenDir === 'up' ? -dy : dy;
                }
                const dx = endView.x - startView.x;
                return screenDir === 'right' ? dx : -dx;
            };
            const positive = screenScore(1);
            const negative = screenScore(-1);
            if (Math.abs(positive - negative) < 1e-6) {
                return null;
            }
            return positive > negative ? 1 : -1;
        }

        function oppositeScreenDir(screenDir) {
            if (screenDir === 'up') return 'down';
            if (screenDir === 'down') return 'up';
            if (screenDir === 'right') return 'left';
            return 'right';
        }

        function resolveTurnSign(kind, screenDir, slice) {
            const rotAxis = CUBE_AXES[slice.axisName];
            const edgePos = slotPos(slice.face, edgeStickerIndex(kind, slice.line, screenDir));
            const edgeSign = turnSignForSticker(kind, screenDir, edgePos, rotAxis);
            if (edgeSign !== null) {
                return edgeSign;
            }
            const frontPos = stickerOnSliceFrontmost(slice.axisName, slice.layerVal);
            if (frontPos) {
                const frontSign = turnSignForSticker(kind, screenDir, frontPos, rotAxis);
                if (frontSign !== null) {
                    return frontSign;
                }
            }
            return screenDir === 'up' || screenDir === 'right' ? 1 : -1;
        }

        function pickTurnSign(kind, screenDir, slice) {
            const sign = resolveTurnSign(kind, screenDir, slice);
            const oppositeSign = resolveTurnSign(kind, oppositeScreenDir(screenDir), slice);
            if (sign === oppositeSign) {
                return screenDir === 'up' || screenDir === 'right' ? 1 : -1;
            }
            return sign;
        }

        function computeLayerMove(kind, line, screenDir) {
            const band = pickSlice(kind, line);
            const sign = pickTurnSign(kind, screenDir, band);
            const slice = SLICE_OBJECTS[`${band.axisName}:${band.layerVal}`];
            const perm = slice ? slice.permForSign(sign) : identityPerm();
            return { perm: perm || identityPerm() };
        }

        refreshStickerPositions();
        buildLayerPermAtlas();
        SLICE_OBJECTS = buildSliceObjects();

        function applyPermutation(perm) {
            const snapshot = {};
            FACE_NAMES.forEach(face => {
                snapshot[face] = cubeState[face].map(state => ({ ...state }));
            });

            FACE_NAMES.forEach(face => {
                for (let idx = 0; idx < 9; idx++) {
                    const source = perm[slotKey(face, idx)].split(':');
                    const sourceFace = source[0];
                    const sourceIdx = Number(source[1]);
                    cubeState[face][idx] = { ...snapshot[sourceFace][sourceIdx] };
                }
            });
        }

        function renderCube() {
            FACE_NAMES.forEach(face => {
                for (let i = 0; i < 9; i++) {
                    const sticker = stickerMap[face][i];
                    const state = cubeState[face][i];
                    sticker.textContent = state.letter;
                    sticker.classList.toggle('cleared', state.cleared);
                    sticker.classList.toggle('selected', state.selected);
                    COLOR_CLASSES.forEach(colorClass => sticker.classList.remove(colorClass));
                    sticker.classList.add(state.color);
                }
            });
            selectedStickers = selectedStickers.filter(sticker => {
                return sticker.classList.contains('selected') && !sticker.classList.contains('cleared');
            });
        }

        const SLICE_PREVIEW_STEP_MS = 420;

        let slicePreviewTimer = null;

        function stickerGroupsInSlice(axisName, layerVal) {
            const axis = CUBE_AXES[axisName];
            const groups = [];
            FACE_NAMES.forEach(face => {
                const inSlice = [];
                for (let idx = 0; idx < 9; idx++) {
                    if (Math.abs(vecDot(slotPos(face, idx), axis) - layerVal) > 0.55) {
                        continue;
                    }
                    inSlice.push({
                        row: Math.floor(idx / 3),
                        col: idx % 3,
                        sticker: stickerMap[face][idx]
                    });
                }
                if (inSlice.length !== 3) {
                    return;
                }
                const sameRow = inSlice.every(s => s.row === inSlice[0].row);
                const sameCol = inSlice.every(s => s.col === inSlice[0].col);
                if (!sameRow && !sameCol) {
                    return;
                }
                const sorted = inSlice.slice().sort((a, b) => (
                    sameRow ? a.col - b.col : a.row - b.row
                ));
                groups.push(sorted.map(entry => entry.sticker));
            });
            return groups;
        }

        function pulseOrderForDirection(kind, screenDir) {
            if (kind === 'row') {
                return screenDir === 'right' ? [0, 1, 2] : [2, 1, 0];
            }
            return screenDir === 'up' ? [2, 1, 0] : [0, 1, 2];
        }

        function clearSlicePreview() {
            if (slicePreviewTimer !== null) {
                clearInterval(slicePreviewTimer);
                slicePreviewTimer = null;
            }
            document.querySelectorAll('.sticker.slice-preview-active').forEach(sticker => {
                sticker.classList.remove('slice-preview-active');
            });
        }

        function showSlicePreview(kind, line, screenDir) {
            clearSlicePreview();
            const band = pickSlice(kind, line);
            const groups = stickerGroupsInSlice(band.axisName, band.layerVal);
            if (groups.length === 0) {
                return;
            }

            const order = pulseOrderForDirection(kind, screenDir);
            let phase = 0;

            const applyPhase = () => {
                document.querySelectorAll('.sticker.slice-preview-active').forEach(sticker => {
                    sticker.classList.remove('slice-preview-active');
                });
                const bandPos = order[phase];
                groups.forEach(stickers => {
                    const sticker = stickers[bandPos];
                    if (sticker && !sticker.classList.contains('cleared')) {
                        sticker.classList.add('slice-preview-active');
                    }
                });
                phase = (phase + 1) % 3;
            };

            applyPhase();
            slicePreviewTimer = setInterval(applyPhase, SLICE_PREVIEW_STEP_MS);
        }

        function rotateLayer(kind, line, screenDir) {
            if (isLayerRotating) return;
            isLayerRotating = true;
            suppressClickAfterDrag = false;
            clearSelection();
            clearSlicePreview();

            const move = computeLayerMove(kind, line, screenDir);
            applyPermutation(move.perm);
            renderCube();
            isLayerRotating = false;
        }

        function buildRotationControls() {
            const container = document.getElementById('rotate-controls');
            const cell = 210 / 3;

            const addButton = (kind, line, direction, symbol, x, y) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'rotate-btn';
                button.textContent = symbol;
                button.title = `Rotate ${kind} ${line + 1} toward screen ${direction}`;
                button.style.left = `${x}px`;
                button.style.top = `${y}px`;
                button.addEventListener('mouseenter', () => {
                    showSlicePreview(kind, line, direction);
                });
                button.addEventListener('mouseleave', clearSlicePreview);
                button.addEventListener('focus', () => {
                    showSlicePreview(kind, line, direction);
                });
                button.addEventListener('blur', clearSlicePreview);
                button.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                });
                button.addEventListener('touchstart', (e) => {
                    e.stopPropagation();
                    showSlicePreview(kind, line, direction);
                }, { passive: true });
                button.addEventListener('touchend', clearSlicePreview);
                button.addEventListener('touchcancel', clearSlicePreview);
                button.addEventListener('click', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    rotateLayer(kind, line, direction);
                });
                container.appendChild(button);
            };

            for (let row = 0; row < 3; row++) {
                const y = SCENE_OFFSET + row * cell + cell / 2;
                addButton('row', row, 'left', '◀', ARROW_INSET, y);
                addButton('row', row, 'right', '▶', STAGE_SIZE - ARROW_INSET, y);
            }

            for (let col = 0; col < 3; col++) {
                const x = SCENE_OFFSET + col * cell + cell / 2;
                addButton('col', col, 'up', '▲', x, ARROW_INSET);
                addButton('col', col, 'down', '▼', x, STAGE_SIZE - ARROW_INSET);
            }
        }

        // Initialize Cube
        document.querySelectorAll('.face').forEach(face => {
            const baseColor = face.getAttribute('data-color');
            const faceName = face.getAttribute('data-face');
            stickerMap[faceName] = [];
            cubeState[faceName] = [];

            for (let i = 0; i < 9; i++) {
                const sticker = document.createElement('div');
                sticker.classList.add('sticker', baseColor);
                const letter = letters[Math.floor(Math.random() * letters.length)];
                sticker.textContent = letter;

                sticker.dataset.face = faceName;
                sticker.dataset.index = i;

                cubeState[faceName][i] = {
                    letter,
                    color: baseColor,
                    cleared: false,
                    selected: false
                };

                sticker.addEventListener('click', (e) => handleStickerClick(e, sticker));
                face.appendChild(sticker);
                stickerMap[faceName][i] = sticker;
            }
        });

        buildRotationControls();

        function getBoundaryEdges(face, row, col) {
            const bounds = faceAdjacency[face];
            const edges = [];
            if (row === 0) edges.push(bounds.top);
            if (row === 2) edges.push(bounds.bottom);
            if (col === 0) edges.push(bounds.left);
            if (col === 2) edges.push(bounds.right);
            return edges;
        }

        // 3D Adjacency Engine Validation
        function isAdjacent3D(lastSticker, nextSticker) {
            const f1 = lastSticker.dataset.face;
            const idx1 = parseInt(lastSticker.dataset.index);
            const f2 = nextSticker.dataset.face;
            const idx2 = parseInt(nextSticker.dataset.index);

            const r1 = Math.floor(idx1 / 3), c1 = idx1 % 3;
            const r2 = Math.floor(idx2 / 3), c2 = idx2 % 3;

            if (f1 === f2) {
                return Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1;
            }

            const edges = getBoundaryEdges(f1, r1, c1);
            return edges.some(edge => edge.face === f2 && edge.indices.includes(idx2));
        }

        function handleStickerClick(e, sticker) {
            e.stopPropagation();
            if (suppressClickAfterDrag) {
                suppressClickAfterDrag = false;
                return;
            }
            if (sticker.classList.contains('cleared')) return;

            const selectedIndex = selectedStickers.indexOf(sticker);
            if (selectedIndex !== -1) {
                selectedStickers.splice(selectedIndex).forEach(s => {
                    s.classList.remove('selected');
                    cubeState[s.dataset.face][Number(s.dataset.index)].selected = false;
                });
                updateWordDisplay();
                return;
            }

            if (selectedStickers.length > 0) {
                const last = selectedStickers[selectedStickers.length - 1];
                if (!isAdjacent3D(last, sticker)) {
                    showMessage("Letters must be physically adjacent across the 3D grid!");
                    return;
                }
            }

            sticker.classList.add('selected');
            cubeState[sticker.dataset.face][Number(sticker.dataset.index)].selected = true;
            selectedStickers.push(sticker);
            updateWordDisplay();
        }

        function updateWordDisplay() {
            const word = selectedStickers.map(s => s.textContent).join('');
            document.getElementById('current-word').textContent = word;
        }

        function clearSelection() {
            selectedStickers.forEach(s => {
                s.classList.remove('selected');
                cubeState[s.dataset.face][Number(s.dataset.index)].selected = false;
            });
            selectedStickers = [];
            updateWordDisplay();
        }

        function submitWord() {
            const currentWord = selectedStickers.map(s => s.textContent).join('');
            
            if (currentWord.length < 2 || currentWord.length > 12) {
                showMessage("Words must be between 2 and 12 letters long.");
                return;
            }

            if (wordSet.has(currentWord.toUpperCase())) {
                showMessage(`Valid 3D Word: ${currentWord}!`, "#2ed573");
                selectedStickers.forEach(s => {
                    const face = s.dataset.face;
                    const idx = Number(s.dataset.index);
                    s.classList.remove('selected');
                    s.classList.add('cleared');
                    cubeState[face][idx].selected = false;
                    cubeState[face][idx].cleared = true;
                });
                selectedStickers = [];
                updateWordDisplay();
            } else {
                showMessage(`"${currentWord}" not found in local dictionary.`, "#ff4757");
                clearSelection();
            }
        }

        function showMessage(txt, color = "#ffd43b") {
            const msgEl = document.getElementById('message');
            msgEl.textContent = txt;
            msgEl.style.color = color;
        }

        // Camera Drag Mechanics
        const cube = document.getElementById('cube');
        let isDragging = false;
        let dragDistance = 0;
        let previousPointer = { x: 0, y: 0 };
        const DRAG_CLICK_THRESHOLD = 5;

        function beginDrag(clientX, clientY) {
            isDragging = true;
            dragDistance = 0;
            suppressClickAfterDrag = false;
            clearSlicePreview();
            previousPointer = { x: clientX, y: clientY };
        }

        function updateDrag(clientX, clientY) {
            if (!isDragging) return;
            const deltaMove = {
                x: clientX - previousPointer.x,
                y: clientY - previousPointer.y
            };
            dragDistance += Math.abs(deltaMove.x) + Math.abs(deltaMove.y);
            if (dragDistance > DRAG_CLICK_THRESHOLD) {
                suppressClickAfterDrag = true;
            }
            currentRotation.y += deltaMove.x * 0.4;
            currentRotation.x -= deltaMove.y * 0.4;
            cube.style.transform = `rotateX(${currentRotation.x}deg) rotateY(${currentRotation.y}deg)`;
            previousPointer = { x: clientX, y: clientY };
        }

        function endDrag() {
            isDragging = false;
        }

        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('.rotate-btn') || isLayerRotating) return;
            beginDrag(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => updateDrag(e.clientX, e.clientY));
        window.addEventListener('mouseup', endDrag);

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1 || e.target.closest('.rotate-btn')) return;
            beginDrag(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length !== 1) return;
            updateDrag(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        window.addEventListener('touchend', endDrag);
    </script>
</body>
</html>
