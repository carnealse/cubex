<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            user-select: none;
            touch-action: none;
        }

        .viewport {
            width: 360px;
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 700px;
            perspective-origin: 50% 50%;
            cursor: grab;
        }

        .viewport.is-dragging {
            cursor: grabbing;
        }

        .cube {
            width: 210px;
            height: 210px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(0deg) rotateY(0deg);
        }

        .face {
            position: absolute;
            width: 210px;
            height: 210px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            padding: 4px;
            background: #000;
            border-radius: 6px;
            backface-visibility: hidden;
        }

        .sticker {
            border-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 0.35);
            pointer-events: none;
        }

        .sticker.slice-highlight {
            outline: 3px solid rgba(255, 255, 255, 0.95);
            outline-offset: -1px;
            filter: brightness(1.3);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.75);
            z-index: 2;
        }

        .face[data-face="front"]  { transform: rotateY(0deg) translateZ(105px); }
        .face[data-face="back"]   { transform: rotateY(180deg) translateZ(105px); }
        .face[data-face="right"]  { transform: rotateY(90deg) translateZ(105px); }
        .face[data-face="left"]   { transform: rotateY(-90deg) translateZ(105px); }
        .face[data-face="top"]    { transform: rotateX(90deg) translateZ(105px); }
        .face[data-face="bottom"] { transform: rotateX(-90deg) translateZ(105px); }
    </style>
</head>
<body>
    <div class="viewport" id="viewport">
        <div class="cube" id="cube"></div>
    </div>

    <script>
        const FACE_NAMES = ['front', 'back', 'right', 'left', 'top', 'bottom'];
        const SIDE_FACES = ['front', 'right', 'back', 'left'];
        const HIGHLIGHT_DELAY_MS = 500;
        const PERSPECTIVE_PX = 700;
        const CUBE_UNIT_PX = 105;

        const COLORS = {
            front:  '#009b48',
            back:   '#0046ad',
            right:  '#b71234',
            left:   '#ff5800',
            top:    '#ffffff',
            bottom: '#ffd500'
        };

        const FACE_BASIS = {
            front:  { n: [0, 0, 1],  right: [1, 0, 0],  down: [0, -1, 0] },
            back:   { n: [0, 0, -1], right: [-1, 0, 0], down: [0, -1, 0] },
            right:  { n: [1, 0, 0],  right: [0, 0, -1], down: [0, -1, 0] },
            left:   { n: [-1, 0, 0], right: [0, 0, 1],  down: [0, -1, 0] },
            top:    { n: [0, 1, 0],  right: [1, 0, 0],  down: [0, 0, -1] },
            bottom: { n: [0, -1, 0], right: [1, 0, 0],  down: [0, 0, 1] }
        };

        const cube = document.getElementById('cube');
        const stickers = {};
        const cubeState = {};
        let highlightTimer = null;
        let activeSlice = null;
        let lockedSlice = null;
        let sliceKeydownListener = null;
        let pendingPointer = null;

        let SLOT_LIST = [];
        let LAYER_PERM = {};

        function stickerId(face, row, col) {
            return `${face}:${row}:${col}`;
        }

        function slotKey(face, index) {
            return `${face}:${index}`;
        }

        function vec3(x, y, z) {
            return [x, y, z];
        }

        function add3(a, b) {
            return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
        }

        function sub3(a, b) {
            return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
        }

        function scale3(v, s) {
            return [v[0] * s, v[1] * s, v[2] * s];
        }

        function dot3(a, b) {
            return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
        }

        function normalize3(v) {
            const len = Math.hypot(v[0], v[1], v[2]) || 1;
            return [v[0] / len, v[1] / len, v[2] / len];
        }

        function worldPos(face, row, col) {
            const basis = FACE_BASIS[face];
            const u = col - 1;
            const v = 1 - row;
            return [
                basis.n[0] * 1.5 + basis.right[0] * u + basis.down[0] * v,
                basis.n[1] * 1.5 + basis.right[1] * u + basis.down[1] * v,
                basis.n[2] * 1.5 + basis.right[2] * u + basis.down[2] * v
            ];
        }

        function viewTransformVec(vec, rxDeg, ryDeg) {
            const rx = rxDeg * Math.PI / 180;
            const ry = ryDeg * Math.PI / 180;
            let x = vec[0];
            let y = vec[1];
            let z = vec[2];
            const y1 = y * Math.cos(rx) - z * Math.sin(rx);
            z = y * Math.sin(rx) + z * Math.cos(rx);
            y = y1;
            const x1 = x * Math.cos(ry) + z * Math.sin(ry);
            z = -x * Math.sin(ry) + z * Math.cos(ry);
            return [x1, y, z];
        }

        function buildSlotList() {
            const slots = [];
            FACE_NAMES.forEach((face) => {
                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 3; col++) {
                        const index = row * 3 + col;
                        slots.push({
                            face,
                            row,
                            col,
                            index,
                            pos: worldPos(face, row, col)
                        });
                    }
                }
            });
            return slots;
        }

        function raycastFacelet(clientX, clientY) {
            const rect = viewport.getBoundingClientRect();
            const sx = clientX - rect.left - rect.width / 2;
            const sy = clientY - rect.top - rect.height / 2;
            const rayDir = normalize3([sx / PERSPECTIVE_PX, -sy / PERSPECTIVE_PX, -1]);
            const rayOrig = [0, 0, PERSPECTIVE_PX / CUBE_UNIT_PX];

            let best = null;
            let bestDepth = -Infinity;

            FACE_NAMES.forEach((face) => {
                const basis = FACE_BASIS[face];
                const center = viewTransformVec(scale3(basis.n, 1.5), rotation.x, rotation.y);
                const normal = normalize3(viewTransformVec(basis.n, rotation.x, rotation.y));
                const right = viewTransformVec(basis.right, rotation.x, rotation.y);
                const down = viewTransformVec(basis.down, rotation.x, rotation.y);

                const denom = dot3(rayDir, normal);
                if (denom >= -0.001) {
                    return;
                }

                const t = dot3(sub3(center, rayOrig), normal) / denom;
                if (t < 0) {
                    return;
                }

                const hit = add3(rayOrig, scale3(rayDir, t));
                const rel = sub3(hit, center);
                const u = dot3(rel, right);
                const v = dot3(rel, down);
                if (u < -1.02 || u > 1.02 || v < -1.02 || v > 1.02) {
                    return;
                }

                if (hit[2] <= bestDepth) {
                    return;
                }

                const col = Math.min(2, Math.max(0, Math.floor(((u + 1) / 2) * 3)));
                const row = Math.min(2, Math.max(0, Math.floor(((1 - v) / 2) * 3)));

                bestDepth = hit[2];
                best = { face, row, col };
            });

            return best;
        }

        function layerIndexFromCoord(axis, face, row, col) {
            const pos = worldPos(face, row, col);
            const axisIndex = axis === 'X' ? 0 : axis === 'Y' ? 1 : 2;
            const value = pos[axisIndex];
            if (value < -0.5) {
                return 0;
            }
            if (value > 0.5) {
                return 2;
            }
            return 1;
        }

        function sliceFromFacelet(face, row, col) {
            if (SIDE_FACES.includes(face) && row === 0) {
                return { type: 'column', index: layerIndexFromCoord('X', face, row, col), axis: 'X' };
            }

            if (face === 'top' && (row === 0 || row === 2 || col === 0 || col === 2)) {
                return { type: 'column', index: layerIndexFromCoord('X', face, row, col), axis: 'X' };
            }

            if (SIDE_FACES.includes(face) && (col === 0 || col === 2)) {
                return { type: 'row', index: layerIndexFromCoord('Y', face, row, col), axis: 'Y' };
            }

            return null;
        }

        function sliceKey(slice) {
            if (!slice) {
                return null;
            }
            return `${slice.type}:${slice.axis}:${slice.index}`;
        }

        function sliceEquals(a, b) {
            return sliceKey(a) !== null && sliceKey(a) === sliceKey(b);
        }

        function indexToLayerKey(index) {
            return String(index - 1);
        }

        function validateSlice(slice) {
            if (!slice) {
                return false;
            }
            if (slice.type !== 'column' && slice.type !== 'row') {
                return false;
            }
            if (![0, 1, 2].includes(slice.index)) {
                return false;
            }
            if (slice.type === 'column' && slice.axis !== 'X') {
                return false;
            }
            if (slice.type === 'row' && slice.axis !== 'Y') {
                return false;
            }
            const layerKey = indexToLayerKey(slice.index);
            return ringEntries(slice.type, layerKey).length === 12;
        }

        function columnFaceCol(layerKey) {
            if (layerKey === '-1') {
                return 0;
            }
            if (layerKey === '1') {
                return 2;
            }
            return 1;
        }

        function rowFaceLine(layerKey) {
            if (layerKey === '-1') {
                return 2;
            }
            if (layerKey === '1') {
                return 0;
            }
            return 1;
        }

        function columnRingEntries(layerKey) {
            const col = columnFaceCol(layerKey);
            const backCol = 2 - col;
            const entries = [];
            for (let row = 0; row < 3; row++) {
                entries.push(
                    { face: 'front', index: row * 3 + col },
                    { face: 'top', index: row * 3 + col },
                    { face: 'back', index: (2 - row) * 3 + backCol },
                    { face: 'bottom', index: (2 - row) * 3 + col }
                );
            }
            return entries;
        }

        function rowRingEntries(layerKey) {
            const row = rowFaceLine(layerKey);
            const entries = [];
            for (let col = 0; col < 3; col++) {
                entries.push(
                    { face: 'front', index: row * 3 + col },
                    { face: 'right', index: row * 3 + col },
                    { face: 'back', index: row * 3 + (2 - col) },
                    { face: 'left', index: row * 3 + (2 - col) }
                );
            }
            return entries;
        }

        function ringEntries(type, layerKey) {
            return type === 'column'
                ? columnRingEntries(layerKey)
                : rowRingEntries(layerKey);
        }

        function identityPermutation() {
            const perm = {};
            SLOT_LIST.forEach((slot) => {
                const key = slotKey(slot.face, slot.index);
                perm[key] = key;
            });
            return perm;
        }

        function buildColumnPermutation(layerKey, sign) {
            const perm = identityPermutation();
            const col = columnFaceCol(layerKey);
            const backCol = 2 - col;

            for (let row = 0; row < 3; row++) {
                const ring = [
                    { face: 'front', index: row * 3 + col },
                    { face: 'top', index: row * 3 + col },
                    { face: 'back', index: (2 - row) * 3 + backCol },
                    { face: 'bottom', index: (2 - row) * 3 + col }
                ];

                for (let i = 0; i < ring.length; i++) {
                    const dest = ring[i];
                    const src = ring[(i - sign + ring.length) % ring.length];
                    perm[slotKey(dest.face, dest.index)] = slotKey(src.face, src.index);
                }
            }

            return perm;
        }

        function buildRowPermutation(layerKey, sign) {
            const perm = identityPermutation();
            const row = rowFaceLine(layerKey);

            for (let col = 0; col < 3; col++) {
                const ring = [
                    { face: 'front', index: row * 3 + col },
                    { face: 'right', index: row * 3 + col },
                    { face: 'back', index: row * 3 + (2 - col) },
                    { face: 'left', index: row * 3 + (2 - col) }
                ];

                for (let i = 0; i < ring.length; i++) {
                    const dest = ring[i];
                    const src = ring[(i - sign + ring.length) % ring.length];
                    perm[slotKey(dest.face, dest.index)] = slotKey(src.face, src.index);
                }
            }

            return perm;
        }

        function buildLayerPermutations() {
            const perms = {};
            ['column', 'row'].forEach((type) => {
                [-1, 0, 1].forEach((layerVal) => {
                    [1, -1].forEach((sign) => {
                        const layerKey = String(layerVal);
                        perms[`${type}:${layerKey}:${sign}`] = type === 'column'
                            ? buildColumnPermutation(layerKey, sign)
                            : buildRowPermutation(layerKey, sign);
                    });
                });
            });
            return perms;
        }

        function initCubeState() {
            FACE_NAMES.forEach((face) => {
                cubeState[face] = Array.from({ length: 9 }, () => COLORS[face]);
            });
        }

        function renderCube() {
            FACE_NAMES.forEach((face) => {
                for (let index = 0; index < 9; index++) {
                    const row = Math.floor(index / 3);
                    const col = index % 3;
                    const stickerEl = sticker(face, row, col);
                    if (stickerEl) {
                        stickerEl.style.backgroundColor = cubeState[face][index];
                    }
                }
            });
        }

        function applyPermutation(perm) {
            const snapshot = {};
            FACE_NAMES.forEach((face) => {
                snapshot[face] = cubeState[face].slice();
            });

            FACE_NAMES.forEach((face) => {
                for (let index = 0; index < 9; index++) {
                    const sourceKey = perm[slotKey(face, index)];
                    if (!sourceKey) {
                        continue;
                    }
                    const [sourceFace, sourceIndex] = sourceKey.split(':');
                    cubeState[face][index] = snapshot[sourceFace][Number(sourceIndex)];
                }
            });
        }

        function executeSliceTurn(slice, sign) {
            if (!validateSlice(slice)) {
                return false;
            }
            const layerKey = indexToLayerKey(slice.index);
            const perm = LAYER_PERM[`${slice.type}:${layerKey}:${sign}`];
            if (!perm) {
                return false;
            }
            applyPermutation(perm);
            renderCube();
            return true;
        }

        function slotFromKey(key) {
            const [face, index] = key.split(':');
            return SLOT_LIST.find((slot) => slot.face === face && slot.index === Number(index)) ?? null;
        }

        function frontmostRingSlot(slice) {
            if (!validateSlice(slice)) {
                return null;
            }
            const layerKey = indexToLayerKey(slice.index);
            let best = null;
            let bestZ = -Infinity;
            ringEntries(slice.type, layerKey).forEach((entry) => {
                const slot = slotFromKey(slotKey(entry.face, entry.index));
                if (!slot) {
                    return;
                }
                const view = viewTransformVec(slot.pos, rotation.x, rotation.y);
                if (view[2] > bestZ) {
                    bestZ = view[2];
                    best = slot;
                }
            });
            return best;
        }

        function sliceScreenVector(slice) {
            if (!validateSlice(slice)) {
                return null;
            }
            const layerKey = indexToLayerKey(slice.index);
            let fromPos;
            let toPos;

            if (slice.type === 'column') {
                const col = columnFaceCol(layerKey);
                fromPos = worldPos('front', 2, col);
                toPos = worldPos('front', 0, col);
            } else {
                const row = rowFaceLine(layerKey);
                fromPos = worldPos('front', row, 0);
                toPos = worldPos('front', row, 2);
            }

            const fromScreen = viewTransformVec(fromPos, rotation.x, rotation.y);
            const toScreen = viewTransformVec(toPos, rotation.x, rotation.y);
            return {
                x: toScreen[0] - fromScreen[0],
                y: toScreen[1] - fromScreen[1]
            };
        }

        function pieceMotionOnScreen(slice, sign) {
            if (!validateSlice(slice)) {
                return null;
            }
            const layerKey = indexToLayerKey(slice.index);
            const perm = LAYER_PERM[`${slice.type}:${layerKey}:${sign}`];
            const slot = frontmostRingSlot(slice);
            if (!perm || !slot) {
                return null;
            }

            const destKey = slotKey(slot.face, slot.index);
            const sourceKey = perm[destKey];
            const source = slotFromKey(sourceKey);
            if (!source) {
                return null;
            }

            const destView = viewTransformVec(slot.pos, rotation.x, rotation.y);
            const sourceView = viewTransformVec(source.pos, rotation.x, rotation.y);
            return {
                dx: destView[0] - sourceView[0],
                dy: destView[1] - sourceView[1]
            };
        }

        function signForScreenDirection(slice, screenDir) {
            const positive = pieceMotionOnScreen(slice, 1);
            const negative = pieceMotionOnScreen(slice, -1);
            if (!positive || !negative) {
                return null;
            }

            const score = (motion) => {
                if (screenDir === 'up') {
                    return motion.dy;
                }
                if (screenDir === 'down') {
                    return -motion.dy;
                }
                if (screenDir === 'right') {
                    return motion.dx;
                }
                return -motion.dx;
            };

            const positiveScore = score(positive);
            const negativeScore = score(negative);
            if (Math.abs(positiveScore - negativeScore) < 1e-6) {
                return null;
            }
            return positiveScore > negativeScore ? 1 : -1;
        }

        function removeHighlightVisuals() {
            document.querySelectorAll('.sticker.slice-highlight').forEach((stickerEl) => {
                stickerEl.classList.remove('slice-highlight');
            });
        }

        function applySliceHighlight(slice) {
            if (!validateSlice(slice)) {
                return false;
            }

            removeHighlightVisuals();
            const layerKey = indexToLayerKey(slice.index);
            ringEntries(slice.type, layerKey).forEach((entry) => {
                const row = Math.floor(entry.index / 3);
                const col = entry.index % 3;
                const stickerEl = sticker(entry.face, row, col);
                if (stickerEl) {
                    stickerEl.classList.add('slice-highlight');
                }
            });
            return true;
        }

        function clearHoverHighlight() {
            if (highlightTimer !== null) {
                clearTimeout(highlightTimer);
                highlightTimer = null;
            }

            if (lockedSlice) {
                return;
            }

            activeSlice = null;
            removeHighlightVisuals();
        }

        function showSliceHighlight(slice) {
            if (!validateSlice(slice)) {
                return;
            }
            applySliceHighlight(slice);
            activeSlice = { ...slice };
        }

        function unlockHighlight() {
            if (highlightTimer !== null) {
                clearTimeout(highlightTimer);
                highlightTimer = null;
            }

            lockedSlice = null;
            activeSlice = null;
            removeHighlightVisuals();
            disableSliceKeyboard();
        }

        function lockSlice(slice) {
            if (!validateSlice(slice)) {
                return;
            }
            lockedSlice = { ...slice };
            activeSlice = { ...slice };
            applySliceHighlight(lockedSlice);
            enableSliceKeyboard();
        }

        function scheduleHoverHighlight(slice) {
            if (lockedSlice || !validateSlice(slice)) {
                return;
            }

            if (highlightTimer !== null) {
                clearTimeout(highlightTimer);
            }

            const target = { ...slice };
            highlightTimer = setTimeout(() => {
                highlightTimer = null;
                if (lockedSlice) {
                    return;
                }
                showSliceHighlight(target);
            }, HIGHLIGHT_DELAY_MS);
        }

        function updateHoverFromPointer(clientX, clientY) {
            if (lockedSlice || isDragging) {
                return;
            }

            const hit = raycastFacelet(clientX, clientY);
            const slice = hit ? sliceFromFacelet(hit.face, hit.row, hit.col) : null;

            if (!validateSlice(slice)) {
                clearHoverHighlight();
                return;
            }

            if (sliceEquals(slice, activeSlice) && highlightTimer === null && document.querySelector('.sticker.slice-highlight')) {
                return;
            }

            if (sliceEquals(slice, activeSlice) && highlightTimer !== null) {
                return;
            }

            clearHoverHighlight();
            scheduleHoverHighlight(slice);
        }

        function turnLockedSlice(screenDir) {
            if (!validateSlice(lockedSlice)) {
                return false;
            }

            const vector = sliceScreenVector(lockedSlice);
            if (!vector) {
                return false;
            }

            const vertical = Math.abs(vector.y) > Math.abs(vector.x);
            if (vertical && (screenDir === 'left' || screenDir === 'right')) {
                return false;
            }
            if (!vertical && (screenDir === 'up' || screenDir === 'down')) {
                return false;
            }

            const sign = signForScreenDirection(lockedSlice, screenDir);
            if (sign === null) {
                return false;
            }

            if (!executeSliceTurn(lockedSlice, sign)) {
                return false;
            }

            applySliceHighlight(lockedSlice);
            return true;
        }

        function onSliceKeydown(event) {
            if (!validateSlice(lockedSlice)) {
                return;
            }

            const screenDirs = {
                ArrowUp: 'up',
                ArrowDown: 'down',
                ArrowLeft: 'left',
                ArrowRight: 'right'
            };

            const screenDir = screenDirs[event.key];
            if (!screenDir) {
                return;
            }

            if (turnLockedSlice(screenDir)) {
                event.preventDefault();
            }
        }

        function enableSliceKeyboard() {
            if (sliceKeydownListener) {
                return;
            }
            sliceKeydownListener = onSliceKeydown;
            window.addEventListener('keydown', sliceKeydownListener);
        }

        function disableSliceKeyboard() {
            if (!sliceKeydownListener) {
                return;
            }
            window.removeEventListener('keydown', sliceKeydownListener);
            sliceKeydownListener = null;
        }

        function buildCube() {
            FACE_NAMES.forEach((face) => {
                const faceEl = document.createElement('div');
                faceEl.className = 'face';
                faceEl.dataset.face = face;

                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 3; col++) {
                        const stickerEl = document.createElement('div');
                        stickerEl.className = 'sticker';
                        stickerEl.dataset.face = face;
                        stickerEl.dataset.row = String(row);
                        stickerEl.dataset.col = String(col);
                        stickerEl.dataset.index = String(row * 3 + col);
                        stickerEl.style.backgroundColor = COLORS[face];
                        faceEl.appendChild(stickerEl);
                        stickers[stickerId(face, row, col)] = stickerEl;
                    }
                }

                cube.appendChild(faceEl);
            });
        }

        function sticker(face, row, col) {
            return stickers[stickerId(face, row, col)] ?? null;
        }

        function bandStickers(face, kind, line) {
            const results = [];
            for (let i = 0; i < 3; i++) {
                const row = kind === 'row' ? line : i;
                const col = kind === 'col' ? line : i;
                const stickerEl = sticker(face, row, col);
                if (stickerEl) {
                    results.push(stickerEl);
                }
            }
            return results;
        }

        buildCube();
        SLOT_LIST = buildSlotList();
        LAYER_PERM = buildLayerPermutations();
        initCubeState();
        renderCube();

        const viewport = document.getElementById('viewport');
        const DEFAULT_ROTATION = { x: 0, y: 0 };
        let rotation = { ...DEFAULT_ROTATION };
        let isDragging = false;
        let activePointerId = null;
        let lastPointer = { x: 0, y: 0 };
        let dragDistance = 0;

        function applyRotation() {
            cube.style.transform = `rotateX(${rotation.x}deg) rotateY(${rotation.y}deg)`;
        }

        function resetRotation() {
            rotation = { ...DEFAULT_ROTATION };
            applyRotation();
        }

        viewport.addEventListener('pointerdown', (event) => {
            isDragging = false;
            dragDistance = 0;
            activePointerId = event.pointerId;
            lastPointer = { x: event.clientX, y: event.clientY };
            pendingPointer = { x: event.clientX, y: event.clientY };
            viewport.setPointerCapture(event.pointerId);
        });

        viewport.addEventListener('pointermove', (event) => {
            if (event.pointerId !== activePointerId) {
                return;
            }

            const dx = event.clientX - lastPointer.x;
            const dy = event.clientY - lastPointer.y;
            dragDistance += Math.hypot(dx, dy);

            if (dragDistance > 5) {
                isDragging = true;
                viewport.classList.add('is-dragging');
                clearHoverHighlight();
            }

            if (isDragging) {
                rotation.y += dx * 0.5;
                rotation.x -= dy * 0.5;
                applyRotation();
                lastPointer = { x: event.clientX, y: event.clientY };
                return;
            }

            updateHoverFromPointer(event.clientX, event.clientY);
            lastPointer = { x: event.clientX, y: event.clientY };
        });

        function endPointer(event) {
            if (event.pointerId !== activePointerId) {
                return;
            }

            if (!isDragging && !lockedSlice && validateSlice(activeSlice)) {
                const hit = raycastFacelet(event.clientX, event.clientY);
                const slice = hit ? sliceFromFacelet(hit.face, hit.row, hit.col) : null;
                if (sliceEquals(slice, activeSlice)) {
                    lockSlice(activeSlice);
                }
            }

            isDragging = false;
            activePointerId = null;
            pendingPointer = null;
            viewport.classList.remove('is-dragging');

            if (viewport.hasPointerCapture(event.pointerId)) {
                viewport.releasePointerCapture(event.pointerId);
            }
        }

        viewport.addEventListener('pointerup', endPointer);
        viewport.addEventListener('pointercancel', endPointer);

        viewport.addEventListener('pointerleave', () => {
            if (!lockedSlice) {
                clearHoverHighlight();
            }
        });

        viewport.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            unlockHighlight();
        });

        applyRotation();

        window.cubeApi = {
            faces: FACE_NAMES,
            colors: COLORS,
            sticker,
            bandStickers,
            getRotation: () => ({ ...rotation }),
            setRotation: (x, y) => {
                rotation = { x, y };
                applyRotation();
            },
            resetRotation,
            getLockedSlice: () => (lockedSlice ? { ...lockedSlice } : null),
            unlockHighlight,
            turnLockedSlice,
            raycastFacelet,
            sliceFromFacelet
        };
    </script>
</body>
</html>
