<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            user-select: none;
            touch-action: none;
        }

        .viewport {
            width: 360px;
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 700px;
            perspective-origin: 50% 50%;
            cursor: grab;
        }

        .viewport.is-dragging {
            cursor: grabbing;
        }

        .cube {
            width: 210px;
            height: 210px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(0deg) rotateY(0deg);
        }

        .face {
            position: absolute;
            width: 210px;
            height: 210px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            padding: 4px;
            background: #000;
            border-radius: 6px;
            backface-visibility: hidden;
        }

        .sticker {
            border-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 0.35);
            pointer-events: none;
        }

        .sticker.slice-highlight {
            outline: 3px solid rgba(255, 255, 255, 0.95);
            outline-offset: -1px;
            filter: brightness(1.3);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.75);
            z-index: 2;
        }

        .edge-zones {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        .edge-zones--top {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            align-items: start;
            height: 22px;
        }

        .edge-zones--bottom {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            align-items: end;
            height: 22px;
            top: auto;
            bottom: 0;
        }

        .edge-zones--left {
            display: grid;
            grid-template-rows: repeat(3, 1fr);
            justify-items: start;
            width: 22px;
        }

        .edge-zones--right {
            display: grid;
            grid-template-rows: repeat(3, 1fr);
            justify-items: end;
            width: 22px;
            left: auto;
            right: 0;
        }

        .edge-hover-zone {
            width: 100%;
            height: 100%;
            min-width: 18px;
            min-height: 18px;
            pointer-events: auto;
            background: transparent;
            cursor: default;
        }

        .face[data-face="front"]  { transform: rotateY(0deg) translateZ(105px); }
        .face[data-face="back"]   { transform: rotateY(180deg) translateZ(105px); }
        .face[data-face="right"]  { transform: rotateY(90deg) translateZ(105px); }
        .face[data-face="left"]   { transform: rotateY(-90deg) translateZ(105px); }
        .face[data-face="top"]    { transform: rotateX(90deg) translateZ(105px); }
        .face[data-face="bottom"] { transform: rotateX(-90deg) translateZ(105px); }
    </style>
</head>
<body>
    <div class="viewport" id="viewport">
        <div class="cube" id="cube"></div>
    </div>

    <script>
        const FACE_NAMES = ['front', 'back', 'right', 'left', 'top', 'bottom'];
        const SIDE_FACES = ['front', 'right', 'back', 'left'];
        const HIGHLIGHT_DELAY_MS = 500;

        const COLORS = {
            front:  '#009b48',
            back:   '#0046ad',
            right:  '#b71234',
            left:   '#ff5800',
            top:    '#ffffff',
            bottom: '#ffd500'
        };

        const FACE_BASIS = {
            front:  { n: [0, 0, 1],  right: [1, 0, 0],  down: [0, -1, 0] },
            back:   { n: [0, 0, -1], right: [-1, 0, 0], down: [0, -1, 0] },
            right:  { n: [1, 0, 0],  right: [0, 0, -1], down: [0, -1, 0] },
            left:   { n: [-1, 0, 0], right: [0, 0, 1],  down: [0, -1, 0] },
            top:    { n: [0, 1, 0],  right: [1, 0, 0],  down: [0, 0, -1] },
            bottom: { n: [0, -1, 0], right: [1, 0, 0],  down: [0, 0, 1] }
        };

        const cube = document.getElementById('cube');
        const stickers = {};
        let highlightTimer = null;
        let activeHighlight = null;
        let lockedHighlight = null;

        function highlightKey(kind, layer) {
            return `${kind}:${layer}`;
        }

        function sliceFromZone(zone) {
            const kind = zone.dataset.sliceKind;
            if (!kind) {
                return null;
            }
            const layer = kind === 'column' ? zone.dataset.layerX : zone.dataset.layerY;
            if (!layer) {
                return null;
            }
            return { kind, layer };
        }

        function stickerId(face, row, col) {
            return `${face}:${row}:${col}`;
        }

        function snapLayer(value) {
            if (value < -0.5) {
                return '-1';
            }
            if (value > 0.5) {
                return '1';
            }
            return '0';
        }

        function worldPos(face, row, col) {
            const basis = FACE_BASIS[face];
            const u = col - 1;
            const v = 1 - row;
            return [
                basis.n[0] * 1.5 + basis.right[0] * u + basis.down[0] * v,
                basis.n[1] * 1.5 + basis.right[1] * u + basis.down[1] * v,
                basis.n[2] * 1.5 + basis.right[2] * u + basis.down[2] * v
            ];
        }

        function layerCoords(face, row, col) {
            const [x, y, z] = worldPos(face, row, col);
            return {
                x: snapLayer(x),
                y: snapLayer(y),
                z: snapLayer(z)
            };
        }

        function buildCube() {
            FACE_NAMES.forEach((face) => {
                const faceEl = document.createElement('div');
                faceEl.className = 'face';
                faceEl.dataset.face = face;

                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 3; col++) {
                        const sticker = document.createElement('div');
                        const layers = layerCoords(face, row, col);
                        sticker.className = 'sticker';
                        sticker.dataset.face = face;
                        sticker.dataset.row = String(row);
                        sticker.dataset.col = String(col);
                        sticker.dataset.index = String(row * 3 + col);
                        sticker.dataset.layerX = layers.x;
                        sticker.dataset.layerY = layers.y;
                        sticker.dataset.layerZ = layers.z;
                        sticker.style.backgroundColor = COLORS[face];
                        faceEl.appendChild(sticker);
                        stickers[stickerId(face, row, col)] = sticker;
                    }
                }

                if (SIDE_FACES.includes(face)) {
                    faceEl.appendChild(buildTopEdgeZones(face));
                    faceEl.appendChild(buildSideEdgeZones(face, 'left'));
                    faceEl.appendChild(buildSideEdgeZones(face, 'right'));
                }

                cube.appendChild(faceEl);
            });
        }

        function buildTopEdgeZones(face) {
            const container = document.createElement('div');
            container.className = 'edge-zones edge-zones--top';

            for (let col = 0; col < 3; col++) {
                const zone = document.createElement('div');
                const anchor = layerCoords(face, 0, col);
                zone.className = 'edge-hover-zone edge-hover-zone--column';
                zone.dataset.sliceKind = 'column';
                zone.dataset.layerX = anchor.x;
                zone.title = 'Column slice';
                wireEdgeZone(zone);
                container.appendChild(zone);
            }

            return container;
        }

        function buildSideEdgeZones(face, side) {
            const container = document.createElement('div');
            container.className = `edge-zones edge-zones--${side}`;

            for (let row = 0; row < 3; row++) {
                const col = side === 'left' ? 0 : 2;
                const zone = document.createElement('div');
                const anchor = layerCoords(face, row, col);
                zone.className = 'edge-hover-zone edge-hover-zone--row';
                zone.dataset.sliceKind = 'row';
                zone.dataset.layerY = anchor.y;
                zone.title = 'Row slice';
                wireEdgeZone(zone);
                container.appendChild(zone);
            }

            return container;
        }

        function removeHighlightVisuals() {
            document.querySelectorAll('.sticker.slice-highlight').forEach((sticker) => {
                sticker.classList.remove('slice-highlight');
            });
        }

        function clearHoverHighlight() {
            if (highlightTimer !== null) {
                clearTimeout(highlightTimer);
                highlightTimer = null;
            }

            if (lockedHighlight) {
                return;
            }

            activeHighlight = null;
            removeHighlightVisuals();
        }

        function showSliceHighlight(kind, layer) {
            if (!layer) {
                return;
            }

            removeHighlightVisuals();
            applySliceHighlight(kind, layer);
            activeHighlight = { kind, layer };
        }

        function unlockHighlight() {
            if (highlightTimer !== null) {
                clearTimeout(highlightTimer);
                highlightTimer = null;
            }

            lockedHighlight = null;
            activeHighlight = null;
            removeHighlightVisuals();
        }

        function lockHighlight(kind, layer) {
            lockedHighlight = { kind, layer };
            activeHighlight = { kind, layer };
            showSliceHighlight(kind, layer);
        }

        function applySliceHighlight(kind, layer) {
            if (!layer) {
                return;
            }

            const attr = kind === 'column' ? 'data-layer-x' : 'data-layer-y';
            const matches = document.querySelectorAll(`.sticker[${attr}="${layer}"]`);
            if (!matches.length) {
                return;
            }

            matches.forEach((sticker) => {
                sticker.classList.add('slice-highlight');
            });
        }

        function wireEdgeZone(zone) {
            zone.addEventListener('mouseenter', () => {
                if (lockedHighlight) {
                    return;
                }

                const slice = sliceFromZone(zone);
                if (!slice) {
                    return;
                }

                if (highlightTimer !== null) {
                    clearTimeout(highlightTimer);
                }

                const { kind, layer } = slice;
                highlightTimer = setTimeout(() => {
                    highlightTimer = null;
                    if (lockedHighlight) {
                        return;
                    }
                    showSliceHighlight(kind, layer);
                }, HIGHLIGHT_DELAY_MS);
            });

            zone.addEventListener('mouseleave', () => {
                clearHoverHighlight();
            });

            zone.addEventListener('click', (event) => {
                if (event.button !== 0 || lockedHighlight) {
                    return;
                }

                const slice = sliceFromZone(zone);
                if (!slice || !activeHighlight) {
                    return;
                }

                if (highlightKey(slice.kind, slice.layer) !== highlightKey(activeHighlight.kind, activeHighlight.layer)) {
                    return;
                }

                event.stopPropagation();
                lockHighlight(slice.kind, slice.layer);
            });
        }

        function sticker(face, row, col) {
            return stickers[stickerId(face, row, col)] ?? null;
        }

        function bandStickers(face, kind, line) {
            const results = [];
            for (let i = 0; i < 3; i++) {
                const row = kind === 'row' ? line : i;
                const col = kind === 'col' ? line : i;
                const stickerEl = sticker(face, row, col);
                if (stickerEl) {
                    results.push(stickerEl);
                }
            }
            return results;
        }

        buildCube();

        const viewport = document.getElementById('viewport');
        const DEFAULT_ROTATION = { x: 0, y: 0 };
        let rotation = { ...DEFAULT_ROTATION };
        let isDragging = false;
        let activePointerId = null;
        let lastPointer = { x: 0, y: 0 };

        function applyRotation() {
            cube.style.transform = `rotateX(${rotation.x}deg) rotateY(${rotation.y}deg)`;
        }

        function resetRotation() {
            rotation = { ...DEFAULT_ROTATION };
            applyRotation();
        }

        viewport.addEventListener('pointerdown', (event) => {
            if (event.target.closest('.edge-hover-zone')) {
                return;
            }

            isDragging = true;
            activePointerId = event.pointerId;
            lastPointer = { x: event.clientX, y: event.clientY };
            viewport.classList.add('is-dragging');
            clearHoverHighlight();
            viewport.setPointerCapture(event.pointerId);
        });

        viewport.addEventListener('pointermove', (event) => {
            if (!isDragging || event.pointerId !== activePointerId) {
                return;
            }

            const dx = event.clientX - lastPointer.x;
            const dy = event.clientY - lastPointer.y;
            lastPointer = { x: event.clientX, y: event.clientY };

            rotation.y += dx * 0.5;
            rotation.x -= dy * 0.5;
            applyRotation();
        });

        function endDrag(event) {
            if (!isDragging || (event.pointerId !== activePointerId && event.type !== 'pointercancel')) {
                return;
            }

            isDragging = false;
            activePointerId = null;
            viewport.classList.remove('is-dragging');

            if (viewport.hasPointerCapture(event.pointerId)) {
                viewport.releasePointerCapture(event.pointerId);
            }
        }

        viewport.addEventListener('pointerup', endDrag);
        viewport.addEventListener('pointercancel', endDrag);

        viewport.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            unlockHighlight();
        });

        applyRotation();

        window.cubeApi = {
            faces: FACE_NAMES,
            colors: COLORS,
            sticker,
            bandStickers,
            getRotation: () => ({ ...rotation }),
            setRotation: (x, y) => {
                rotation = { x, y };
                applyRotation();
            },
            resetRotation,
            getLockedHighlight: () => (lockedHighlight ? { ...lockedHighlight } : null),
            unlockHighlight
        };
    </script>
</body>
</html>
